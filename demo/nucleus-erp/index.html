<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nucleus ERP — Design Lab (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sage:linear-gradient(45deg,#96C0B1 0%,#B1D5C4 35%,#C5E4D2 65%,#E0F8E5 100%);
  --blue:#5170FF; --blue-strong:#4A63F0; --turq:#9EF7F5;
  --lime:#C6E852;
  --ink:#0B0B0B; --ink-2:#2E3430; --ink-3:#545B57;
  --line:#E3E7E4; --line-2:#CDD3CF; --card-2:#F5F7F6;
  --good:#1F7A3A; --good-bg:#DCF2E2; --good-ink:#0B4A1F;
  --warn-bg:#FFE45C; --warn-ink:#0B0B0B;
  --info-bg:#E3E9FF; --info-ink:#1F3BCC;
  --crit:#C2362B; --crit-bg:#FBE1DE; --crit-ink:#8A1F17;
  --radius:22px;
  --shadow:0 1px 2px rgba(20,60,45,.06),10px 14px 28px -14px rgba(24,72,56,.42);
  --tq:#BEFBE6;            /* turquoise feature card */
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:Manrope,system-ui,sans-serif;background:#B9D8C9;background-image:var(--sage);min-height:100vh;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.preview{background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:center;padding:7px 12px;flex-wrap:wrap;text-align:center}
.preview b{background:var(--lime);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:11px;letter-spacing:.06em}
.preview button{background:none;border:1px solid #555;border-radius:999px;color:#fff;padding:2px 10px;font-size:11.5px}

/* layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;padding:16px 22px 48px}
.side{position:sticky;top:16px;height:calc(100vh - 64px);background:#fff;border-radius:26px;padding:18px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.side a{display:flex;gap:11px;align-items:center;padding:10px 13px;border-radius:999px;color:var(--ink-2);font-weight:650;font-size:13.5px;text-decoration:none}
.side a:hover{background:var(--card-2);color:var(--ink)}
.side a.on{background:var(--blue-strong);color:#fff}
.side a svg{width:17px;height:17px;flex:none}
.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:800;padding:14px 13px 6px}
.side .sub{padding-left:40px;font-size:13px;font-weight:600}
.side .sub.on{background:#EEF2FF;color:var(--info-ink)}
.side .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gsearch{position:relative;flex:1;max-width:560px}
.gsearch label{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:11px 16px;box-shadow:var(--shadow)}
.gsearch input{border:0;outline:0;flex:1;background:none;min-width:0}
.gsearch input::placeholder{color:var(--ink-3)}
.gsearch kbd{font-size:11px;font-weight:700;background:var(--card-2);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;color:var(--ink-3)}
.gres{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border-radius:18px;box-shadow:0 24px 50px -16px rgba(0,0,0,.3);padding:8px;z-index:40;display:none}
.gres.show{display:block}
.gres a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:600}
.gres a:hover,.gres a.hl{background:var(--card-2)}
.gres small{margin-left:auto;color:var(--ink-3);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.spacer{flex:1}
.icon-btn{width:42px;height:42px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;position:relative;box-shadow:var(--shadow)}
.icon-btn svg{width:17px;height:17px}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid #fff}
.qc{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border-radius:18px;box-shadow:0 24px 50px -16px rgba(0,0,0,.3);padding:8px;z-index:40;min-width:220px;display:none}
.menu.show{display:block}
.menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 12px;border-radius:12px;font-weight:650;text-align:left}
.menu button:hover{background:var(--card-2)}
.menu svg{width:15px;height:15px}

.crumbs{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:12.5px;font-weight:650;margin:4px 0 8px;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs span:last-child{color:var(--ink)}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-weight:400;font-size:42px;letter-spacing:-.025em;margin:0;line-height:1.08}
h1 .badge{vertical-align:middle;margin-left:10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:650;font-size:13px;text-decoration:none;white-space:nowrap}
.pill:hover{border-color:var(--line-2)}
.pill.lime{background:var(--lime);border-color:var(--lime);font-weight:800}
.pill.lime:hover{filter:brightness(.97)}
.pill.blue{background:var(--blue-strong);border-color:var(--blue-strong);color:#fff}
.pill.danger{color:var(--crit-ink)}
.pill svg{width:15px;height:15px}
.pill.sm{padding:7px 12px;font-size:12.5px}
.seg{display:inline-flex;background:#fff;border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap;box-shadow:var(--shadow)}
.seg a,.seg button{border:0;background:none;padding:8px 15px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.seg a:hover,.seg button:hover{background:var(--card-2)}
.seg .on,.seg .on:hover{background:var(--blue-strong);color:#fff}
.subnav{margin:-4px 0 16px}

.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:18px 20px 0}
.card-h h3{margin:0;font-size:16px;font-weight:750;letter-spacing:-.01em}
.card-h small{display:block;color:var(--ink-3);font-weight:600;font-size:12px}
.card-h .ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.card-h .ic svg{width:15px;height:15px}
.card-h .tools{margin-left:auto;display:flex;gap:6px}
.card-b{padding:14px 20px 20px}
.mini{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;text-decoration:none}
.mini svg{width:14px;height:14px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.card.tq{background:var(--tq)}
.tq .hbar{background:#fff;border:0;border-radius:16px;padding:11px 14px;margin-bottom:8px;border:1px solid rgba(11,11,11,.06)}
.tq .hbar:last-child{margin-bottom:0;border-bottom:1px solid rgba(11,11,11,.06)}
.tq .hbar{grid-template-columns:1fr auto;row-gap:9px}
.tq .hbar .track{background:#E6EBFF;grid-column:1/-1;order:3}
.tq .hbar .fill{background:var(--blue)}
.tq .card-h .ic,.tq .mini{background:#fff;border-color:transparent}
.tq .toggle{border-color:rgba(11,11,11,.08)}
.tq .progress{background:#fff}
.tq .progress i{background:var(--blue)}
.tq .kv dt,.tq .card-h small{color:#3F4743}
/* electric-blue feature-card variant (toggle in the top bar) */
body.fblue{--tq:#4A63F0}
body.fblue .card.tq,body.fblue .ai{color:#fff}
body.fblue .tq .card-h h3,body.fblue .ai .card-h h3,body.fblue .tq .card-h small,body.fblue .tq>.card-b>p.muted,body.fblue .tq .muted,body.fblue .tq .kv dt,body.fblue .tq .kv dd,body.fblue .tq .bignum span{color:#fff}
body.fblue .tq .card-h .ic,body.fblue .tq .mini{color:var(--ink)}
body.fblue .tq .hbar{color:var(--ink)}
body.fblue .tq .hbar .muted,body.fblue .tq .hbar .kv dt{color:var(--ink-3)}
body.fblue .tq .hbar .kv dd{color:var(--ink)}

body.fblue .ins,body.fblue .ai .ask,body.fblue .tq .pill,body.fblue .tq .kcard{color:var(--ink)}
body.fblue .ai .badge.b-info{background:#fff}
.fswitch{display:inline-flex;background:#2A2F2C;border-radius:999px;padding:2px;gap:2px}
.fswitch button{border:0;background:none;color:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.fswitch button.on{background:#fff;color:var(--ink)}
.fswitch i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));margin-bottom:16px}
.kpi{padding:18px 20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi:first-child{border-left:0}
.kpi .lbl{font-weight:750;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.kpi .val{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.kpi .sub{font-size:12px;font-weight:600;color:var(--ink-3)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:750;font-size:12px;padding:3px 7px;border-radius:999px;margin-top:6px;width:max-content}
.delta.up{background:var(--good-bg);color:var(--good-ink)}
.delta.down{background:var(--crit-bg);color:var(--crit-ink)}
.delta.flat{background:#ECEEEC;color:var(--ink-2)}
.delta svg{width:11px;height:11px}
.spark{width:92px;height:34px;flex:none;overflow:visible}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:750;line-height:1.2;white-space:nowrap}
.badge svg{width:12px;height:12px;flex:none}
.b-neutral{background:#E7EAE8;color:#1F2420}
.b-warn{background:var(--warn-bg);color:var(--warn-ink)}
.b-good{background:var(--good-bg);color:var(--good-ink)}
.b-info{background:var(--info-bg);color:var(--info-ink)}
.b-crit{background:var(--crit-bg);color:var(--crit-ink)}
.b-lime{background:var(--lime);color:var(--ink)}
.tagc{display:inline-block;background:#EEF0EE;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700;color:var(--ink-2);margin-right:4px}

/* table / list */
.tabs{display:flex;gap:4px;padding:14px 16px 0;flex-wrap:wrap;align-items:center}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:750;font-size:13px;color:var(--ink-2);display:flex;gap:7px;align-items:center}
.tab:hover{background:var(--card-2)}
.tab .n{background:#E9ECEA;color:var(--ink);border-radius:999px;padding:1px 7px;font-size:11.5px}
.tab.on{background:var(--blue-strong);color:#fff}
.tab.on .n{background:#fff;color:var(--blue-strong)}
.ltools{display:flex;padding:12px 16px;gap:10px;flex-wrap:wrap;align-items:center}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:8px 13px;min-width:280px;background:#fff}
.search input{border:0;outline:none;flex:1;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.search svg{width:15px;height:15px;color:var(--ink-3)}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12.5px;font-weight:750;color:var(--ink-2);padding:11px 12px;border-bottom:1px solid var(--line-2);background:var(--card-2);white-space:nowrap;user-select:none}
.t th.sortable{cursor:pointer}
.t th.sortable:hover{color:var(--ink)}
.t th:first-child,.t td:first-child{padding-left:20px}
.t th:last-child,.t td:last-child{padding-right:20px}
.t td{padding:12px 12px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap;color:var(--ink-2);font-weight:500}
.t tbody tr[data-href],.t tbody tr[data-act]{cursor:pointer}
.t tbody tr:hover td{background:#F7F9F8}
.t tr.attn td{color:var(--ink);font-weight:700}
.t tr.attn td:first-child{box-shadow:inset 3px 0 0 #E8B500}
.t tr.critrow td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.t tr.selrow td{background:#EEF2FF}
.t .strong{color:var(--ink);font-weight:750}
.t .link{color:var(--ink);font-weight:800}
.t td.r,.t th.r{text-align:right}
.t tfoot td{border-bottom:0;font-weight:700;color:var(--ink)}
.chk{width:17px;height:17px;accent-color:var(--blue)}
.lfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;color:var(--ink-3);font-weight:650;font-size:12.5px;gap:10px;flex-wrap:wrap}
.pager{display:flex;gap:6px;align-items:center}
.empty{text-align:center;padding:48px 20px;color:var(--ink-3);font-weight:600}
.ellip{max-width:240px;overflow:hidden;text-overflow:ellipsis}

/* detail */
.kv{display:grid;grid-template-columns:140px 1fr;gap:9px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink-3);font-weight:650}
.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.dtabs{display:flex;gap:4px;padding:12px 14px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.dtabs button{border:0;background:none;padding:10px 12px;font-weight:750;font-size:13px;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-1px}
.dtabs button.on{color:var(--ink);border-color:var(--blue)}
.dpanel{display:none}
.dpanel.on{display:block}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl li::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#E7EAE8}
.tl .d.done{background:var(--blue-strong);color:#fff}
.tl .d svg{width:12px;height:12px}
.tl b{display:block;font-size:13.5px}
.tl span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.note{background:var(--card-2);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;margin-bottom:8px}
.note small{display:block;color:var(--ink-3);margin-top:4px}

/* charts */
svg text{font-family:Manrope,system-ui,sans-serif}
.axis{fill:var(--ink-3);font-size:11px;font-weight:650}
.chart{display:block;width:100%;height:auto}
.sl .m{opacity:0}
.sl:hover .m{opacity:1}
.bar{transition:opacity .15s}
.bar:hover{opacity:.8}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.legend li{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;font-weight:650;font-size:13px}
.legend i{width:12px;height:12px;border-radius:4px}
.legend .c{font-weight:800}
.legend .p{color:var(--ink-3);font-size:12px;width:40px;text-align:right}
.hbar{display:grid;grid-template-columns:minmax(110px,170px) 1fr 76px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-weight:650;font-size:13px}
.hbar:last-child{border-bottom:0}
.hbar .track{height:12px;background:#EEF1EF;border-radius:6px;position:relative;overflow:hidden}
.hbar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#9EF7F5 0%,#587CFE 100%);border-radius:6px}
.hbar .target{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--crit)}
.hbar .v{text-align:right;font-weight:800}
.hbar a{text-decoration:none}
.hbar a:hover{text-decoration:underline}
.bignum{font-size:44px;font-weight:400;letter-spacing:-.03em;line-height:1;padding:8px 20px 0}
.bignum span{color:var(--ink-3)}
.stats-row{display:flex;gap:24px;padding:12px 20px 0;flex-wrap:wrap}
.stats-row div{font-size:12px;color:var(--ink-3);font-weight:650}
.stats-row b{display:block;font-size:21px;color:var(--ink);font-weight:600;letter-spacing:-.02em}

/* AI card */
.ai{position:relative;overflow:hidden;min-height:330px;display:flex;flex-direction:column;background:var(--tq)}
.ai canvas{position:absolute;inset:0;width:100%;height:100%}
.ai .card-h{position:relative}
.ai .insights{position:relative;margin-top:auto;padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.ins{background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-radius:16px;padding:10px 12px;font-size:12.5px;font-weight:650;display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(11,11,11,.07)}
.ins .tag{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:999px}
.ins a{font-weight:800}
.ask{display:flex;align-items:center;gap:10px;background:var(--lime);border-radius:999px;padding:6px 6px 6px 16px;font-weight:650;font-size:12.5px}
.ask input{flex:1;border:0;background:none;outline:none;min-width:0}
.ask input::placeholder{color:#2A3310}
.ask button{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:grid;place-items:center}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.kcol{background:#fff;border-radius:var(--radius);padding:14px;min-height:300px;box-shadow:var(--shadow)}
.kcol.over{outline:2px dashed var(--blue);outline-offset:-4px}
.kcol h3{display:flex;align-items:center;gap:8px;margin:4px 6px 12px;font-size:14px}
.kcard{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;border:1px solid rgba(11,11,11,.07);box-shadow:0 1px 2px rgba(11,11,11,.08),3px 8px 18px -6px rgba(24,60,48,.38);cursor:grab;transition:transform .15s,box-shadow .15s}
.kcard.sel,.kcard.sel:hover{background:var(--lime);border-color:#B5D63F}
.kcard.sel .meta{color:#2A3310}
.kcard:hover{transform:translateY(-1px);box-shadow:0 1px 2px rgba(11,11,11,.1),4px 12px 22px -6px rgba(24,60,48,.45)}
.kcard b{display:block;font-size:13.5px;margin-bottom:6px}
.kcard .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3);font-weight:650}

/* settings */
.scard{display:flex;gap:14px;align-items:flex-start;padding:18px;text-decoration:none}
.scard:hover{outline:2px solid var(--blue);outline-offset:-2px}
.scard .ic{width:40px;height:40px;border-radius:12px;background:#EEF2FF;color:var(--blue-strong);display:grid;place-items:center;flex:none}
.scard b{display:block;margin-bottom:4px}
.scard span{color:var(--ink-3);font-weight:600;font-size:12.5px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:16px}
.toggle:last-child{border-bottom:0}
.toggle b{display:block;font-size:13.5px}
.toggle span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#CDD3CF;border-radius:999px;transition:.2s;cursor:pointer}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--blue-strong)}

    if(d.n===tot){s+=`<circle cx="${cx}" cy="${cy}" r="${(r+ri)/2}" fill="none" stroke="${d.c}" stroke-width="${r-ri}" data-tip="${esc(d.k)} · <b>${d.n}</b> (100%)"/>`;a0=a1;return;}
    const[x0,y0]=Pp(r,s0),[x1,y1]=Pp(r,s1),[x2,y2]=Pp(ri,s1),[x3,y3]=Pp(ri,s0),L=(s1-s0)>Math.PI?1:0;
    s+=`<path data-tip="${esc(d.k)} · <b>${d.n}</b> (${Math.round(d.n/tot*100)}%)" d="M${x0},${y0}A${r},${r} 0 ${L} 1 ${x1},${y1}L${x2},${y2}A${ri},${ri} 0 ${L} 0 ${x3},${y3}Z" fill="${d.c}"/>`;a0=a1;});
  s+=`<text x="${cx}" y="${cy-1}" text-anchor="middle" font-size="28" font-weight="600" fill="#0B0B0B">${esc(center)}</text><text x="${cx}" y="${cy+18}" text-anchor="middle" class="axis">${esc(sub)}</text>`;
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" width="160" height="160" role="img" aria-label="Donut chart">${s}</svg><ul class="legend" style="flex:1;min-width:170px">${data.map(d=>`<li><i style="background:${d.c}"></i><span>${esc(d.k)}</span><span class="c num">${d.n}</span><span class="p num">${Math.round(d.n/tot*100)}%</span></li>`).join('')}</ul></div>`;
}

}

let waveRAF;
function initWaves(){cancelAnimationFrame(waveRAF);const cvs=$$('canvas.wave');if(!cvs.length)return;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const dpr=devicePixelRatio||1;
  const st=cvs.map(cv=>({cv,b:[]}));
  const size=()=>st.forEach(o=>{const r=o.cv.getBoundingClientRect();o.cv.width=r.width*dpr;o.cv.height=r.height*dpr;o.w=o.cv.width;o.h=o.cv.height;
    o.b=Array.from({length:24},(_,i)=>mk(o,true));});
  const mk=(o,init)=>{const r=(2+Math.random()**2*9)*dpr;const b={x:o.w*(.05+Math.random()*.9),y:init?o.h*(.15+Math.random()*.6):o.h*.62+r,r,v:(.15+Math.random()*.35)*dpr,ph:Math.random()*6.28,a:0,y0:0,c:(document.body.classList.contains('fblue')?['#8FA3FF','#AFC0FF','#C7D3FF','#9EF7F5','#7B95FF','#B6F3FF']:['#5170FF','#4A63F0','#3D55E0','#6E89FF','#8FA3FF','#AFC0FF'])[Math.floor(Math.random()*6)]};b.y0=b.y+(init?60*dpr:0);return b;};
  const bubble=(c,b)=>{c.globalAlpha=b.a*.9;c.fillStyle=b.c;c.beginPath();c.arc(b.x,b.y,b.r,0,7);c.fill();c.globalAlpha=1;};
  size();
  const draw=()=>{st.forEach(o=>{const c=o.cv.getContext('2d');c.clearRect(0,0,o.w,o.h);
    const top=o.h*.07;
    o.b.forEach((b,i)=>{b.y-=b.v;b.ph+=.02;b.x+=Math.sin(b.ph)*.25*dpr;
      const fadeIn=(b.y0-b.y)/(40*dpr),fadeOut=Math.min(1,(b.y-top)/(60*dpr));b.a=Math.max(0,Math.min(1,Math.min(fadeIn,fadeOut)));
      if(b.y<top)o.b[i]=mk(o,false);bubble(c,b);});});
    if(!reduce)waveRAF=requestAnimationFrame(draw);};
  draw();window.onresize=()=>{size();if(reduce)draw();};}

    `<div class="grid g2"><section class="card tq">${cardH('mail','Open rate by email','')}<div class="card-b">${em.filter(e=>e.open).sort((a,b)=>b.open-a.open).slice(0,5).map(e=>`<div class="hbar"><span>${esc(e.name)}</span><span class="v num">${e.open}%</span><div class="track"><div class="fill" style="width:${e.open}%"></div></div></div>`).join('')}</div></section>
    <section class="card">${cardH('chart','Revenue by email','last 30 days')}<div style="padding:10px 12px">${barChart({values:em.filter(e=>e.rev).map(e=>e.rev),labels:em.filter(e=>e.rev).map(e=>e.name),short:em.filter(e=>e.rev).map(e=>e.name.split(' ')[0]),fmt:x=>money(x,0),axisFmt:kmoney,pl:48,hi:2,aria:'Revenue per email'})}</div></section></div>`+
    listCard({key:'emails',rows:()=>DB.emails,select:false,ph:'Search email',text:e=>e.name,tabs:[['camp','Campaigns',e=>e.type==='Campaign'],['flow','Flows',e=>e.type==='Flow']],
      cols:[{h:'Email',v:e=>`<span class="strong">${esc(e.name)}</span>`},{h:'Type',v:e=>badge(e.type==='Flow'?'Flow':'Campaign')},{h:'Status',v:e=>badge(e.status==='Scheduled campaign'?'Scheduled':e.status)},{h:'Sent',r:1,v:e=>e.sent.toLocaleString(),sv:e=>e.sent},{h:'Open rate',r:1,v:e=>e.open?e.open+'%':'—',sv:e=>e.open},{h:'Click rate',r:1,v:e=>e.click?e.click+'%':'—',sv:e=>e.click},{h:'Revenue',r:1,v:e=>`<span class="strong num">${money(e.rev,0)}</span>`,sv:e=>e.rev}]});}
  if(tab==='lists')return head+`<div class="grid g3">${DB.lists.map(l=>`<section class="card ${l.type==='Segment'?'tq':''}">${cardH('users',esc(l.name),l.type+' · '+esc(l.source))}<div class="card-b"><div class="bignum num" style="padding:0">${l.count.toLocaleString()}<span style="font-size:16px"> contacts</span></div><div style="margin-top:12px">${l.growth?`<span class="delta ${l.growth>0?'up':'down'}">${l.growth>0?arrowUp:arrowDn}${l.growth>0?'+':''}${l.growth}% this month</span>`:'<span class="delta flat">No change</span>'}</div><div style="display:flex;gap:8px;margin-top:14px">${btn('Send campaign','new-campaign','sm lime')}${btn('Export','export','sm')}</div></div></section>`).join('')}</div>`;
  if(tab==='pages')return head+listCard({key:'pages',rows:()=>DB.pages,select:false,ph:'Search page',text:p=>p.name+' '+p.slug,
      cols:[{h:'Page',v:p=>`<span class="strong">${esc(p.name)}</span><br><span class="muted" style="font-size:12px">toliccs.com.au${p.slug}</span>`},{h:'Status',v:p=>badge(p.status)},{h:'Visits (30 days)',r:1,v:p=>p.visits.toLocaleString(),sv:p=>p.visits},{h:'Conversion',r:1,v:p=>p.conv?p.conv+'%':'—',sv:p=>p.conv},{h:'Leads',r:1,v:p=>`<span class="strong">${Math.round(p.visits*p.conv/100)}</span>`,sv:p=>p.visits*p.conv},{h:'',v:()=>btn('Edit','soon','sm','edit')}]});
  // attribution
  return head+`<div class="grid g2"><section class="card tq">${cardH('dollar','Return on ad spend','revenue ÷ spend, by channel')}<div class="card-b">${chans.filter(([,x])=>x.spend).sort((a,b)=>b[1].rev/b[1].spend-a[1].rev/a[1].spend).map(([k,x],i,arr)=>`<div class="hbar"><span>${esc(k)}</span><span class="v num">${(x.rev/x.spend).toFixed(1)}×</span><div class="track"><div class="fill" style="width:${(x.rev/x.spend)/(arr[0][1].rev/arr[0][1].spend)*100}%"></div></div></div>`).join('')}</div></section>
  <section class="card">${cardH('chart','Leads by channel','last 30 days')}<div style="padding:10px 12px">${barChart({values:chans.map(([,x])=>x.leads),labels:chans.map(([k])=>k),short:chans.map(([k])=>k.split(' ')[0]),hi:-1,aria:'Leads per channel'})}</div></section></div>
  <section class="card" style="margin-bottom:16px">${cardH('users','Acquisition cost vs lifetime value','per channel')}<div style="height:12px"></div><div class="tbl-wrap"><table class="t" style="min-width:760px"><thead><tr><th>Channel</th><th class="r">Spend</th><th class="r">Leads</th><th class="r">New customers</th><th class="r">CAC</th><th class="r">Est. 12-month LTV</th><th class="r">LTV : CAC</th></tr></thead><tbody>${chans.map(([k,x])=>{const cac=x.custs?x.spend/x.custs:0,ltv=x.custs?x.rev/x.custs*2.6:0;return `<tr><td class="strong">${esc(k)}</td><td class="r num">${money(x.spend,0)}</td><td class="r num">${x.leads}</td><td class="r num">${x.custs}</td><td class="r num">${money(cac,0)}</td><td class="r num">${money(ltv,0)}</td><td class="r"><span class="badge ${cac&&ltv/cac>=3?'b-good':'b-warn'}">${cac?(ltv/cac).toFixed(1)+'×':'—'}</span></td></tr>`;}).join('')}</tbody></table></div></section>`;
}
function campTable(list){return `<div class="tbl-wrap"><table class="t" style="min-width:800px"><thead><tr><th>Campaign</th><th>Channel</th><th class="r">Spend</th><th class="r">Leads</th><th class="r">Revenue</th><th class="r">ROAS</th><th>Status</th></tr></thead><tbody>${list.map(c=>`<tr data-href="#campaign-${c.k}"><td class="link">${esc(c.name)}</td><td>${esc(c.ch)}</td><td class="r num">${kmoney(c.spend)}</td><td class="r num">${c.leads}</td><td class="r num strong">${kmoney(c.rev)}</td><td class="r strong">${roas(c).toFixed(1)}×</td><td>${badge(c.status)}</td></tr>`).join('')}</tbody></table></div>`;}
function pCampaign(k){ensureExtra();const c=byId('campaigns',k);if(!c)return notFound('Campaign');
  const n=21,h=[...c.k].reduce((a,x)=>a+x.charCodeAt(0),0);const sp=[...Array(n)].map((_,i)=>c.spend?Math.round(c.spend/n*(.6+((h+i*37)%9)/10)):0),ld=[...Array(n)].map((_,i)=>c.leads?Math.max(0,Math.round(c.leads/n*(.3+((h*3+i*17)%13)/7))):0),lab=series(n,()=>0)[1];
  return crumbs([['Marketing','#marketing'],['Campaigns','#marketing-campaigns'],[c.name]])+phead(`${esc(c.name)} ${badge(c.status==='Scheduled campaign'?'Scheduled':c.status)}`,`${c.status==='Live'?btn('Pause','camp-pause-one'):c.status==='Paused'?btn('Resume','camp-pause-one','lime'):''}${btn('Edit','soon','','edit')}${btn('Duplicate','soon')}`)+
  kpiStrip([{l:'Spend',v:money(c.spend,0),sub:Math.round(c.spend/c.budget*100)+'% of '+money(c.budget,0)},{l:'Impressions',v:(c.impr/1000).toFixed(1)+'k'},{l:'Clicks',v:c.clicks.toLocaleString(),sub:(c.clicks/Math.max(1,c.impr)*100).toFixed(2)+'% CTR'},{l:'Leads',v:c.leads,s:ld,sl:lab},{l:'ROAS',v:c.spend?roas(c).toFixed(1)+'×':'—',sub:kmoney(c.rev)+' revenue'}])+
  `<div class="grid g2"><section class="card">${cardH('chart','Leads per day','last 3 weeks')}<div style="padding:10px 12px">${barChart({values:ld,labels:lab,short:lab.map(l=>l.split(' ')[0]),aria:'Leads per day'})}</div></section>
  <section class="card">${cardH('trend','Daily spend','')}<div style="padding:10px 8px">${areaChart({values:sp,labels:lab,fmt:x=>money(x,0),axisFmt:kmoney,aria:'Daily spend'})}</div></section></div>
  <div class="grid g2"><section class="card tq">${cardH('trend','Results','')}<div class="card-b">${[['Clicks',c.clicks,c.impr],['Leads',c.leads,c.clicks],['Customers',c.custs,c.leads]].map(([k,v,base])=>`<div class="hbar"><span>${k}</span><span class="v num">${v.toLocaleString()} <small class="muted">${base?(v/base*100).toFixed(1):0}%</small></span><div class="track"><div class="fill" style="width:${base?Math.max(3,v/base*100):0}%"></div></div></div>`).join('')}</div></section>
  <section class="card">${cardH('mega','Details','')}<div class="card-b"><dl class="kv"><dt>Channel</dt><dd>${esc(c.ch)}</dd><dt>Owner</dt><dd>${esc(c.owner)}</dd><dt>Start</dt><dd>${fdate(c.start)}</dd><dt>End</dt><dd>${fdate(c.end)}</dd><dt>Budget</dt><dd>${money(c.budget,0)}</dd><dt>UTM</dt><dd>utm_campaign=${c.k.toLowerCase()}</dd></dl></div></section></div>`;}

/* cadence panel on customer page */
const _pCustomer=pCustomer;
pCustomer=function(id){let h=_pCustomer(id);const c=byId('customers',id);if(!c)return h;ensureExtra();const cd=DB.cad[c.id],v=DB.visits.find(x=>x.cust===c.id&&x.status==='Planned');
  const panel=`<section class="card tq" style="margin-bottom:16px">${cardH('cal','Visit cadence',cadStatus(c.id))}<div class="card-b"><div class="hbar" style="display:block"><dl class="kv"><dt>Suggested</dt><dd>${weeksTxt(cd.sug)}</dd><dt>Effective</dt><dd>${weeksTxt(cd.eff)}${cd.eff!==cd.sug?' (override)':''}</dd><dt>Last visit</dt><dd>${fdate(cd.lastVisit)}</dd><dt>Next due</dt><dd>${cadDue(c.id)<0?`<span style="color:var(--crit-ink)">${-cadDue(c.id)} days late</span>`:'in '+cadDue(c.id)+' days'}</dd><dt>Planned</dt><dd>${v?DAYS[v.day]+' '+v.time:'—'}</dd></dl></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${btn('Change cadence','cad-change','sm','',`data-id="${c.id}"`)}${btn('Log visit','cad-log','sm lime','',`data-id="${c.id}"`)}</div></div></section>`;
  return h.replace('<div><section class="card" style="margin-bottom:16px">'+cardH('users','Details',''),'<div>'+panel+'<section class="card" style="margin-bottom:16px">'+cardH('users','Details',''));};

Object.assign(PAGES,{cadence:t=>pCadence(CAD_TABS.some(x=>x[0]===t)?t:'overview'),marketing:t=>pMarketing(MKT_TABS.some(x=>x[0]===t)?t:'overview'),campaign:pCampaign,customer:id=>pCustomer(id)});
Object.assign(ACT,{
  'cad-rep':el=>{LS.cadRep=el.dataset.r;rerender();},
  'cad-autoplan':()=>{ensureExtra();const load=[0,0,0,0,0];DB.visits.forEach(v=>load[v.day]++);let n=0;
    DB.customers.filter(c=>cadStatus(c.id)!=='On track'&&!DB.visits.some(v=>v.cust===c.id&&v.status==='Planned')).forEach(c=>{let d=TODAY_IDX;for(let i=TODAY_IDX;i<5;i++)if(load[i]<load[d])d=i;load[d]++;DB.visits.push({id:'V'+Date.now()+n,cust:c.id,rep:c.rep,day:d,time:['9:00','10:30','13:00','14:30'][n%4],status:'Planned',outcome:''});n++;});
    save();if(LS.cadacc)LS.cadacc.sel.clear();location.hash='#cadence-planner';rerender();toast(n?`Planned ${n} visits for overdue and due-soon accounts`:'Everyone is already planned');},
  'visit-open':el=>{const v=DB.visits.find(x=>x.id===el.dataset.id),c=cust(v.cust);simpleForm('Visit — '+c.name,[{k:'status',l:'Status',opts:['Planned','Visited','Missed'],v:v.status},{k:'outcome',l:'Outcome',opts:['','Order taken','No order','Quote requested','Complaint'],v:v.outcome},{k:'day',l:'Day',opts:DAYS,v:DAYS[v.day]},{k:'time',l:'Time',v:v.time}],d=>{v.status=d.status;v.outcome=d.outcome;v.day=DAYS.indexOf(d.day);v.time=d.time;if(d.status==='Visited')DB.cad[v.cust].lastVisit=dayDate(v.day).toISOString();save();rerender();toast('Visit updated');});},
  'log-call':el=>{const c=cust(el.dataset.id);simpleForm('Log call — '+c.name,[{k:'outcome',l:'Outcome',opts:['Order placed','Will order this week','No answer — retry','Lost to competitor'],full:1},{k:'note',l:'Note',full:1}],d=>{DB.calls.push({cust:c.id,...d,date:TODAY.toISOString()});if(d.outcome==='Order placed')DB.cad[c.id].lastOrder=TODAY.toISOString();save();rerender();toast('Call logged');},'Log call');},
  'cad-change':el=>{const cd=DB.cad[el.dataset.id];simpleForm('Change visit cadence',[{k:'w',l:'Visit every',opts:['1 week','2 weeks','4 weeks','6 weeks','8 weeks'],v:cd.eff+' week'+(cd.eff>1?'s':''),full:1}],d=>{cd.eff=parseInt(d.w);save();rerender();toast('Cadence set to '+weeksTxt(cd.eff).toLowerCase());});},
  'cad-log':el=>{DB.cad[el.dataset.id].lastVisit=TODAY.toISOString();const v=DB.visits.find(x=>x.cust===el.dataset.id&&x.status==='Planned');if(v){v.status='Visited';v.outcome='Order taken';}save();rerender();toast('Visit logged for today');},
  'new-campaign':()=>{ensureExtra();simpleForm('New campaign',[{k:'name',l:'Campaign name',req:1,full:1},{k:'ch',l:'Channel',opts:['Google Ads','Meta Ads','Email','LinkedIn','SEO','Trade show']},{k:'budget',l:'Budget',t:'number',v:1000}],d=>{const id='CMP'+(Math.max(...DB.campaigns.map(c=>+c.id.slice(3)))+1);DB.campaigns.unshift({id,k:id,name:d.name,ch:d.ch,status:'Scheduled campaign',budget:+d.budget,spend:0,leads:0,custs:0,rev:0,clicks:0,impr:0,start:daysAgo(-3).toISOString(),end:daysAgo(-33).toISOString(),owner:'Morgan Lee'});save();location.hash='#campaign-'+id;toast('Campaign created');},'Create campaign');},
  'camp-pause-one':()=>{const c=byId('campaigns',location.hash.split('-')[1]);c.status=c.status==='Live'?'Paused':'Live';save();rerender();toast('Campaign '+c.status.toLowerCase());},
});
const _bulk=ACT.bulk;ACT.bulk=el=>{const a=CUR.bulk[+el.dataset.i][1];if(a==='camp-pause'){const st=LS[CUR.key];[...st.sel].forEach(id=>{const c=byId('campaigns',id);if(c&&c.status==='Live')c.status='Paused';});save();st.sel.clear();refreshList();toast('Campaigns paused');return;}if(a==='cad-autoplan'){ACT['cad-autoplan']();return;}_bulk(el);};
const _reset=ACT.reset;ACT.reset=()=>{_reset();ensureExtra();rerender();};
const _qc=ACT.qcmenu;ACT.qcmenu=()=>{_qc();$('#qcmenu').insertAdjacentHTML('beforeend',`<button data-act="new-campaign">${ic('mega')}Campaign</button>`);};

function applyFeature(f){document.body.classList.toggle('fblue',f==='blue');$$('.fswitch button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));try{localStorage.setItem('nucleusLab.feature',f);}catch(e){}}
ACT.feature=el=>{applyFeature(el.dataset.f);initWaves();toast(el.dataset.f==='blue'?'Feature cards: electric blue':'Feature cards: turquoise');};
(()=>{let f='tq';try{f=localStorage.getItem('nucleusLab.feature')||'tq';}catch(e){}applyFeature(f);})();
route();
</script>
</body>
