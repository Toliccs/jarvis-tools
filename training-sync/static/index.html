<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Calendar</title>
<meta name="color-scheme" content="light dark">
<style>
/* ==========================================================================
   TOKENS
   Intensity is an ORDINAL ramp: one hue, monotone lightness. Distance from the
   surface = how hard the session is. Validated (monotone L, adjacent dL >= .06,
   single hue, light-end contrast 2.06:1 light / 2.15:1 dark). The sub-3:1 end
   step obligates a relief channel -- the always-present intensity WORD and the
   table view (press T) provide it.
   Proposal accent is orange, not violet: measured CVD dE 23.1-25.4 against
   every ramp step in both modes. Violet failed at dE 9.0/12.6.
   ========================================================================== */
:root{
  color-scheme: light dark;

  --ramp-rest:#898781;
  --ramp-easy:#86b6ef;
  --ramp-moderate:#3987e5;
  --ramp-hard:#1c5cab;

  --accent:#eb6834;              /* proposals / Alfred */
  --accent-wash:rgba(235,104,52,.07);
  --focus:#1c5cab;

  --status-good:#0ca30c;
  --status-warning:#fab219;
  --status-critical:#d03b3b;

  --plane:#f9f9f7;
  --surface:#fcfcfb;
  --surface-2:#f2f1ec;
  --ink:#0b0b0b;
  --ink-2:#52514e;
  --ink-muted:#898781;
  --rule:#e1e0d9;
  --border:rgba(11,11,11,.10);
  --meter-track:#cde2fb;
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 4px 14px rgba(11,11,11,.05);
  --shadow-lift:0 6px 22px rgba(11,11,11,.16);
  --hatch:rgba(11,11,11,.08);

  --bar-h:56px;
  --radius:12px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
/* Dark by preference -- but an explicit light choice must beat the media query. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ramp-easy:#184f95;
    --ramp-moderate:#2a78d6;
    --ramp-hard:#86b6ef;
    --accent:#d95926;
    --accent-wash:rgba(217,89,38,.12);
    --focus:#86b6ef;
    --plane:#0d0d0d;
    --surface:#1a1a19;
    --surface-2:#232322;
    --ink:#ffffff;
    --ink-2:#c3c2b7;
    --ink-muted:#898781;
    --rule:#2c2c2a;
    --border:rgba(255,255,255,.10);
    --meter-track:#104281;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-lift:0 6px 22px rgba(0,0,0,.55);
    --hatch:rgba(255,255,255,.09);
  }
}
/* ...and an explicit dark choice must beat a light OS. */
:root[data-theme="dark"]{
  --ramp-easy:#184f95;
  --ramp-moderate:#2a78d6;
  --ramp-hard:#86b6ef;
  --accent:#d95926;
  --accent-wash:rgba(217,89,38,.12);
  --focus:#86b6ef;
  --plane:#0d0d0d;
  --surface:#1a1a19;
  --surface-2:#232322;
  --ink:#ffffff;
  --ink-2:#c3c2b7;
  --ink-muted:#898781;
  --rule:#2c2c2a;
  --border:rgba(255,255,255,.10);
  --meter-track:#104281;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-lift:0 6px 22px rgba(0,0,0,.55);
  --hatch:rgba(255,255,255,.09);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); background:var(--plane); color:var(--ink);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--surface);
  padding:10px 16px;border-radius:8px;border:1px solid var(--border);transition:top .12s}
.skip:focus{top:8px}

/* ---------------------------------------------------------------- A: app bar */
.appbar{
  position:sticky; top:0; z-index:40; min-height:var(--bar-h);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:8px 20px; background:var(--surface); border-bottom:1px solid var(--rule);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em}
.brand svg{width:20px;height:20px;color:var(--ramp-moderate)}
.rangenav{display:flex;align-items:center;gap:2px}
.iconbtn{
  width:32px;height:32px;display:grid;place-items:center;border-radius:8px;
  color:var(--ink-2); border:1px solid transparent;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:17px;height:17px}
.rangelabel{
  font-weight:640; font-size:16px; letter-spacing:-.01em; padding:0 8px;
  min-width:150px; text-align:center;
}
.pill{
  border:1px solid var(--border); border-radius:999px; padding:5px 12px;
  font-size:13px; color:var(--ink-2); background:var(--surface);
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
}
.pill:hover{background:var(--surface-2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--status-good);flex:none}
.pill.warn .dot{background:var(--status-warning)}
.pill.bad .dot{background:var(--status-critical)}
.pill.demo{border-color:var(--accent);color:var(--accent);font-weight:600}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.seg button{
  padding:5px 13px;border-radius:7px;font-size:13.5px;font-weight:550;color:var(--ink-2);
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1 1 auto}
.btn{
  border:1px solid var(--border); border-radius:9px; padding:7px 14px;
  font-size:14px; font-weight:560; background:var(--surface); color:var(--ink);
  display:inline-flex;align-items:center;gap:7px; white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--plane);border-color:var(--ink)}
.btn.primary:hover:not(:disabled){opacity:.88;background:var(--ink)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.accent:hover:not(:disabled){opacity:.9;background:var(--accent)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}

/* ------------------------------------------------------------ B: context row */
.contextrow{
  position:sticky; top:var(--bar-h); z-index:30;
  display:flex; align-items:center; gap:10px 18px; flex-wrap:wrap;
  padding:10px 20px; background:var(--plane); border-bottom:1px solid var(--rule);
  font-size:13.5px; color:var(--ink-2);
}
.ctx-item{display:inline-flex;align-items:center;gap:7px}
.ctx-item b{color:var(--ink);font-weight:640}
.ctx-sep{width:1px;height:16px;background:var(--rule)}
.ctx-warn{color:var(--status-critical);font-weight:560}

/* -------------------------------------------------------- C/D: layout shell */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;align-items:start}
.canvas{padding:18px 20px 28px;min-width:0}
.rail{
  position:sticky; top:calc(var(--bar-h) + 44px); align-self:start;
  height:calc(100vh - var(--bar-h) - 44px); overflow-y:auto;
  border-left:1px solid var(--rule); background:var(--surface);
  padding:18px 16px 40px; display:flex; flex-direction:column; gap:18px;
}
.railtoggle{display:none}

/* --------------------------------------------------------------- week grid */
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.daycol{
  display:flex;flex-direction:column;min-width:0;border-radius:var(--radius);
  background:var(--plane); position:relative;
}
.daycol.today .dayhead{box-shadow:inset 2px 0 0 var(--ramp-moderate)}
.daycol.today .dayname b{color:var(--ramp-moderate)}
.dayhead{
  border:1px solid var(--border); border-radius:10px; background:var(--surface);
  padding:9px 10px; margin-bottom:9px; text-align:left; width:100%;
  display:flex; flex-direction:column; gap:5px; transition:background .12s;
}
.dayhead:hover{background:var(--surface-2)}
.dayname{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--ink-muted);
  text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dayname b{font-size:17px;color:var(--ink);letter-spacing:-.02em;text-transform:none}
.dayfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.daytss{font-variant-numeric:tabular-nums}
.availglyph{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
  padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);
}
.availglyph svg{width:11px;height:11px}
.daycol.unavailable .availglyph{background:var(--status-warning);color:#3a2a00}
.conflictbadge{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:620;
  padding:2px 7px;border-radius:999px;
  background:color-mix(in srgb, var(--status-warning) 22%, transparent);
  color:var(--ink);
}
.conflictbadge svg{width:11px;height:11px;color:var(--status-warning)}

.dropzone{
  flex:1; min-height:120px; display:flex; flex-direction:column; gap:9px;
  padding:3px; border-radius:10px; border:2px dashed transparent; transition:border-color .12s, background .12s;
}
.dropzone.over{border-color:var(--accent);background:var(--accent-wash)}
.dropzone.blocked{border-color:var(--status-critical);background:color-mix(in srgb,var(--status-critical) 8%,transparent)}
.daycol.unavailable{background:
  repeating-linear-gradient(45deg, var(--hatch) 0 6px, transparent 6px 12px);
}
.daycol.unavailable .dayhead,.daycol.unavailable .card{opacity:.82}
.emptyday{
  font-size:12px;color:var(--ink-muted);text-align:center;padding:14px 6px;
  border:1px dashed var(--rule);border-radius:10px;
}

/* -------------------------------------------------------------- workout card */
.card{
  display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden; min-height:92px;
  transition:box-shadow .14s, transform .14s, opacity .14s;
}
.card:hover{box-shadow:var(--shadow-lift)}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.5;transform:scale(1.02);cursor:grabbing}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.card.shake{animation:shake .12s 1}
.card.carried{outline:2px dashed var(--accent);outline-offset:2px}
.card-body{display:flex;align-items:stretch;min-width:0}
.card-bar{width:4px;flex:none;background:var(--intensity,var(--ramp-rest))}
.card.unknown-int .card-bar{
  background:repeating-linear-gradient(45deg,var(--ink-muted) 0 3px,transparent 3px 6px);
}
/* The title gets the full column width: the menu is lifted out of the flow into
   the corner and the sport glyph sits down in the meta row. At a 146px week
   column every pixel of chrome on the title line costs a readable word. */
.card-main{position:relative;flex:1;min-width:0;padding:10px 11px;
  display:flex;flex-direction:column;gap:6px}
.card-top{display:flex;align-items:flex-start}
.glyph{width:14px;height:14px;flex:none;color:var(--ink-2)}
.card-title{
  min-width:0;width:100%;padding-right:20px;
  font-size:14.5px;font-weight:620;line-height:1.28;letter-spacing:-.01em;
  overflow-wrap:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
/* proposal cards carry no ⋮ menu, so they don't reserve room for one */
.card.proposal .card-title{padding-right:0}
.card-menu{
  position:absolute;top:6px;right:4px;z-index:1;
  width:22px;height:22px;display:grid;place-items:center;border-radius:6px;
  color:var(--ink-muted);font-size:15px;line-height:1;
}
.card-menu:hover{background:var(--surface-2);color:var(--ink)}
.card-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.card-meta .num{font-variant-numeric:tabular-nums}
.tss.low{border-bottom:1px dotted var(--ink-muted);cursor:help}
/* Intensity gets its own row so the meter and its WORD never get squeezed out
   by the duration/TSS pair -- the word is the relief channel for the ramp. */
.intwrap{display:flex;align-items:center;gap:6px}
.meter{display:flex;gap:2px}
.meter i{width:7px;height:8px;border-radius:1.5px;background:var(--rule);display:block}
.meter i.on{background:var(--intensity,var(--ramp-rest))}
.intword{font-weight:600;color:var(--ink-2);font-size:12px}
.card-prov{
  font-size:11.5px;color:var(--ink-muted);display:flex;align-items:center;gap:5px;
}
.card-note{font-size:11.5px;color:var(--ink-2);font-style:italic}
.card-push{
  display:flex;align-items:center;gap:6px;padding:6px 11px;font-size:11.5px;font-weight:560;
  border-top:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);
}
.card-push.good{background:color-mix(in srgb,var(--status-good) 12%,transparent);color:var(--ink)}
.card-push.warn{background:color-mix(in srgb,var(--status-warning) 20%,transparent);color:var(--ink)}
.card-push.bad{background:color-mix(in srgb,var(--status-critical) 14%,transparent);color:var(--ink)}
.card-push .rt{margin-left:auto}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:640;
  padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);
  letter-spacing:.01em;
}
.chip.accent{background:var(--accent-wash);color:var(--accent)}
.chip.warn{background:color-mix(in srgb,var(--status-warning) 24%,transparent);color:var(--ink)}

/* moved / proposed / approved -- provenance lives on the BORDER,
   push outcome lives on the bottom STRIP. Different channel, different region,
   so the two never render as adjacent same-shaped marks. */
.card.moved{border-color:var(--ink-muted)}
.card.approved{border:2px solid var(--accent)}
.card.proposal{
  border:2px dashed var(--accent); background:var(--accent-wash);
  box-shadow:none; cursor:pointer;
}
.card.proposal:hover{box-shadow:var(--shadow)}
.card.proposal.selected{box-shadow:0 0 0 3px var(--accent-wash),var(--shadow-lift)}
/* Clamped in the column; the full text always lives in the rail's Why? panel,
   so a long rationale can't turn one card into the whole week. */
.prop-reason{font-size:12.5px;color:var(--ink-2);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.prop-q{
  font-size:12px;font-weight:600;color:var(--ink);background:var(--surface);
  border:1px solid var(--accent);border-radius:8px;padding:6px 8px;
}
.prop-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
/* A multi-session change lists every session it touches: approving a swap is
   one decision about two workouts, so both are on the card. */
.prop-ops{font-size:12px;color:var(--ink-2);line-height:1.45}
.prop-ops-h{font-weight:600;color:var(--ink);margin-bottom:1px}
.prop-op{padding-left:2px}
/* "I couldn't place this" is not a suggestion — it's amber, not accent, and it
   carries no Approve button anywhere on it. */
.card.proposal.unresolved{
  border-color:var(--status-warning);
  background:color-mix(in srgb,var(--status-warning) 9%,transparent);
}
.card.proposal.unresolved.selected{
  box-shadow:0 0 0 3px color-mix(in srgb,var(--status-warning) 26%,transparent),
    var(--shadow-lift);
}
.card.proposal.unresolved .prop-q{border-color:var(--status-warning)}
/* A suggestion whose reason has stopped being true. It stays on the calendar
   so it can be dismissed rather than vanishing unexplained, but it is drawn
   as spent: the old reason is struck through and Approve is gone, because the
   sentence under it is no longer something he should act on. */
.card.proposal.stale{
  border-style:dotted;border-color:var(--ink-muted);
  background:color-mix(in srgb,var(--ink-muted) 7%,transparent);
}
.card.proposal.stale .prop-reason{text-decoration:line-through;opacity:.6}
.card.proposal.stale .prop-ops,
.card.proposal.stale .prop-q{opacity:.6}
.prop-stale{
  font-size:12px;font-weight:600;color:var(--ink);background:var(--surface);
  border:1px solid var(--ink-muted);border-radius:8px;padding:6px 8px;
}
.ghost{
  border:1px dashed var(--ink-muted);border-radius:10px;padding:8px 10px;
  opacity:.55;font-size:12px;color:var(--ink-2);background:transparent;
  display:flex;align-items:center;gap:6px;
}
.suggest-strip{
  display:flex;align-items:center;gap:6px;padding:6px 11px;font-size:11.5px;
  border-top:1px dashed var(--accent);background:var(--accent-wash);color:var(--accent);
  font-weight:600;
}

/* ------------------------------------------------------------- month grid */
.monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.monthdow{
  font-size:11.5px;font-weight:650;color:var(--ink-muted);text-transform:uppercase;
  letter-spacing:.06em;text-align:center;padding-bottom:4px;
}
.mcell{
  min-height:96px;border:1px solid var(--border);border-radius:10px;background:var(--surface);
  padding:7px;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;
}
.mcell.out{opacity:.4}
.mcell.today{box-shadow:inset 0 0 0 2px var(--ramp-moderate)}
.mcell.unavailable{
  background:
   repeating-linear-gradient(45deg,var(--hatch) 0 6px,transparent 6px 12px),var(--surface);
}
.mcell:hover{background:var(--surface-2)}
.mdate{font-size:12.5px;font-weight:640;display:flex;align-items:center;gap:5px}
.mdate .lock{color:var(--status-warning);width:11px;height:11px}
.mchip{
  display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);
  background:var(--surface-2);border-radius:6px;padding:3px 5px;min-width:0;
}
.mchip .idot{width:7px;height:7px;border-radius:50%;background:var(--intensity);flex:none}
.mchip .mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip svg{width:11px;height:11px;flex:none}

/* -------------------------------------------------------------- signal rail */
.tile{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:14px}
.rail .tile{background:var(--plane)}
.tile-h{
  font-size:11.5px;font-weight:660;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-muted);margin-bottom:9px;
}
.hero{font-size:46px;font-weight:680;line-height:1;letter-spacing:-.03em}
.hero-row{display:flex;align-items:baseline;gap:9px}
.hero-word{font-size:13px;font-weight:640;color:var(--ink-2)}
.readymeter{height:9px;border-radius:999px;background:var(--meter-track);margin-top:11px;overflow:hidden}
.readymeter span{display:block;height:100%;border-radius:999px;background:var(--ramp-moderate)}
.readymeter.warn span{background:var(--status-warning)}
.readymeter.bad span{background:var(--status-critical)}
.tile-sub{font-size:12.5px;color:var(--ink-2);margin-top:9px;line-height:1.45}
.statuschip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  background:var(--surface-2);font-size:13px;font-weight:600;
}
.statuschip svg{width:13px;height:13px;color:var(--ink-2)}

/* 7-day load: single series -> ONE color for every bar, no legend (the title
   names it). Today gets a ring + direct label, never a different hue. */
/* stretch, not flex-end: the columns must fill the chart height or the track
   collapses to its content and every bar renders as a 2px stub. */
.loadchart{display:flex;align-items:stretch;gap:2px;height:92px;margin-top:6px}
.loadcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.loadbar-track{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.loadbar{
  width:100%;max-width:24px;background:var(--ramp-moderate);
  border-radius:4px 4px 0 0; min-height:2px;
}
.loadbar.is-today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ramp-moderate)}
.loadbar.zero{background:var(--rule);border-radius:2px}
.loadlab{font-size:10.5px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.loadval{font-size:10.5px;color:var(--ink-2);font-weight:640;font-variant-numeric:tabular-nums;min-height:14px}
.acts{display:flex;flex-direction:column;gap:9px}
.act{display:flex;gap:9px;align-items:flex-start;font-size:12.5px}
.act svg{width:14px;height:14px;color:var(--ink-2);flex:none;margin-top:2px}
.act-n{font-weight:600;line-height:1.3}
.act-m{color:var(--ink-muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.rationale{border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent-wash);padding:14px}
.rationale .tile-h{color:var(--accent)}
.evidence{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.ev{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  border-bottom:1px solid var(--border);padding-bottom:4px}
.ev span:last-child{font-weight:640;font-variant-numeric:tabular-nums;text-align:right}
.altlist{margin:8px 0 0;padding-left:16px;font-size:12px;color:var(--ink-2);line-height:1.5}

/* --------------------------------------------------------------- change bar */
.changebar{
  position:sticky;bottom:0;z-index:35;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px 20px;background:var(--surface);border-top:2px solid var(--accent);
  box-shadow:0 -4px 18px rgba(0,0,0,.07);
}
.changebar .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.changebar b{font-weight:640}

/* ------------------------------------------------------------------ banners */
.banner{
  border:1px solid var(--border);border-left:3px solid var(--ink-muted);border-radius:10px;
  background:var(--surface);padding:12px 14px;margin-bottom:14px;display:flex;gap:11px;
  align-items:flex-start;font-size:13.5px;line-height:1.5;
}
.banner svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--ink-muted)}
.banner.warn{border-left-color:var(--status-warning)}
.banner.warn svg{color:var(--status-warning)}
.banner.bad{border-left-color:var(--status-critical)}
.banner.bad svg{color:var(--status-critical)}
.banner .bt{font-weight:640;display:block;margin-bottom:2px}
.banner .ba{margin-left:auto;display:flex;gap:6px;flex:none}
.banner code{
  background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:12.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.emptystate{
  text-align:center;padding:60px 24px;color:var(--ink-2);max-width:560px;margin:0 auto;
}
.emptystate h2{font-size:19px;font-weight:660;color:var(--ink);margin-bottom:8px;letter-spacing:-.01em}
.emptystate p{font-size:14px;line-height:1.6;margin-bottom:14px}

/* ------------------------------------------------------- popovers & drawers */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:50}
.popover{
  position:absolute;z-index:60;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-lift);padding:14px;width:270px;
  display:flex;flex-direction:column;gap:11px;
}
.popover h4{font-size:13.5px;font-weight:660}
.pop-row{display:flex;gap:6px;flex-wrap:wrap}
.pop-row button{
  border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:13px;flex:1;
  background:var(--surface);
}
.pop-row button:hover{background:var(--surface-2)}
.pop-row button[aria-pressed="true"]{background:var(--ink);color:var(--plane);border-color:var(--ink)}
.pop-lab{font-size:11.5px;font-weight:640;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em}
.checkrow{display:flex;align-items:center;gap:8px;font-size:13px}
.checkrow input{width:16px;height:16px;accent-color:var(--ramp-moderate)}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:60;
  background:var(--surface);border-left:1px solid var(--rule);box-shadow:var(--shadow-lift);
  display:flex;flex-direction:column;
}
.drawer-h{
  display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--rule);
}
.drawer-h h3{font-size:16px;font-weight:660;letter-spacing:-.01em}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.drawer-f{padding:14px 18px;border-top:1px solid var(--rule);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.pushrow{border:1px solid var(--border);border-radius:10px;padding:11px 12px;
  display:flex;flex-direction:column;gap:6px;background:var(--plane)}
.pushrow-t{display:flex;align-items:center;gap:8px}
.pushrow-t .pt{font-weight:620;font-size:13.5px;flex:1;min-width:0}
.pushrow-r{font-size:12px;color:var(--ink-2);line-height:1.45}
.actionchip{font-size:10.5px;font-weight:680;text-transform:uppercase;letter-spacing:.05em;
  padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);flex:none}
.actionchip.create{background:color-mix(in srgb,var(--ramp-moderate) 20%,transparent);color:var(--ink)}
.actionchip.skip{background:var(--surface-2)}
.actionchip.done{background:color-mix(in srgb,var(--status-good) 18%,transparent);color:var(--ink)}
.actionchip.failed{background:color-mix(in srgb,var(--status-critical) 18%,transparent);color:var(--ink)}
.progress{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden;flex:1}
.progress span{display:block;height:100%;background:var(--ramp-moderate);border-radius:999px;transition:width .2s}

/* -------------------------------------------------------------- table view */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);
  font-weight:660;position:sticky;top:0;background:var(--surface)}
tbody tr:last-child td{border-bottom:none}
td.wrap{white-space:normal;min-width:190px}

/* ------------------------------------------------------------------- toast */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--plane);padding:11px 16px;border-radius:10px;
  box-shadow:var(--shadow-lift);display:flex;align-items:center;gap:14px;
  font-size:13.5px;max-width:min(560px,92vw);
}
.toast button{color:var(--plane);font-weight:660;text-decoration:underline;font-size:13.5px;flex:none}
.toast.bad{background:var(--status-critical);color:#fff}
.toast.bad button{color:#fff}

.kbd{
  display:inline-block;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;
  padding:1px 6px;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--surface-2);
}
.helpgrid{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:13px;align-items:center}

/* --------------------------------------------------------------- responsive */
@media (max-width:1280px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{
    position:fixed;top:0;right:0;bottom:0;width:min(340px,90vw);height:100%;z-index:60;
    box-shadow:var(--shadow-lift);
  }
  .rail[hidden]{display:none}
  .railtoggle{display:inline-flex}
}
/* Seven 140px columns do not survive a phone. Below 1024 the week becomes a
   vertical day list so card anatomy stays intact instead of shrinking into
   illegibility. Month view stays a grid but drops to chips-only. */
@media (max-width:1023px){
  .weekgrid{grid-template-columns:minmax(0,1fr);gap:12px}
  .daycol{border:1px solid var(--border);background:var(--surface);padding:10px}
  .daycol.unavailable{background:
    repeating-linear-gradient(45deg,var(--hatch) 0 6px,transparent 6px 12px),var(--surface)}
  .dayhead{border:none;background:transparent;padding:2px 2px 6px;margin-bottom:6px;
    flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .dayhead:hover{background:transparent}
  .dayname{align-items:baseline}
  .dayfoot{justify-content:flex-end}
  .dropzone{min-height:0}
  .emptyday{padding:9px}
  .canvas{padding:14px 12px 24px}
  .appbar{padding:8px 12px;gap:9px}
  .contextrow{padding:9px 12px;top:auto;position:static}
  .rangelabel{min-width:0;font-size:15px}
  .mcell{min-height:70px}
  .brand span{display:none}
}
@media (max-width:560px){
  .hero{font-size:40px}
  .drawer{width:100%}
  .rangelabel{padding:0 4px}
  .btn{padding:7px 10px;font-size:13.5px}
  /* Keep the app bar to two rows: the feed pill keeps its status dot but
     drops its text, which is repeated in the banner when it matters. */
  #feedtext{display:none}
  .pill{padding:6px 9px}
  .appbar{gap:6px;padding:7px 10px}
  .seg button{padding:5px 10px}
  .contextrow{gap:8px 12px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .card.dragging{transform:none}
}
@media (forced-colors:active){
  .card,.dayhead,.tile,.mcell{border:1px solid CanvasText}
  .card.proposal{border:2px dashed Highlight}
  .card-bar{forced-color-adjust:none}
  .loadbar{forced-color-adjust:none}
}
@media print{
  .appbar,.rail,.changebar,.dropzone{display:none}
}
