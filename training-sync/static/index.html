  if (w.description) {
    const d = el("div", "tile-sub");
    d.style.whiteSpace = "pre-wrap";
    d.style.maxHeight = "160px";
    d.style.overflow = "auto";
    d.textContent = w.description;
    pop.appendChild(d);
  }

  document.body.appendChild(back);
  document.body.appendChild(pop);
  positionPopover(pop, anchor);
  pop.querySelector("button").focus();
  S._popover = [back, pop];
}

/* -------------------------------------------------------------- proposals */
/* `focusDate` names the day that prompted the ask. Alfred plans a single
   Monday-anchored week, so pointing him at the changed day's week is the
   difference between an answer and silence — the month grid's own range can
   start weeks before anything changed. */
async function requestProposals(reason, focusDate) {
  const r = focusDate
    ? { start: mondayOf(focusDate), end: addDays(mondayOf(focusDate), 6) }
    : viewRange();
  try {
    const res = await api("/api/proposals", {
      method: "POST", body: { start: r.start, end: r.end, reason: reason || "manual" }
    });
    await loadAll();
    const n = (res.proposals || []).filter(p => !p.stale).length;
    const unresolved = (res.unresolved || []).length;
    const stuckNote = unresolved === 1
      ? " One session he couldn't place is flagged in amber."
      : " " + unresolved + " sessions he couldn't place are flagged in amber.";
    if (n) {
      announce(n + " suggestions ready for review.");
      toast((n === 1 ? "Alfred has a suggestion — approve or reject it below."
        : "Alfred has " + n + " suggestions — nothing changes until you approve.")
        + (unresolved ? stuckNote : ""));
    } else if (unresolved) {
      toast("Alfred couldn't find a good slot — see the flagged sessions.", "bad");
    } else {
      const w = (res.warnings || [])[0];
      toast(w ? w.message : "Nothing to suggest — the week looks fine as it is.");
    }
  } catch (e) {
    toast(e.message, "bad");
  }
}

async function approveProposal(p, quiet) {
  try {
    await api("/api/proposals/" + encodeURIComponent(p.proposal_id) + "/approve",
      { method: "POST", body: { force: false } });
    if (!quiet) {
      await loadAll();
      announce("Approved.");
      toast("Approved. It's on your calendar — hit Push when you want it on the Edge.");
    }
  } catch (e) {
    if (e.code === "proposal_stale") {
      // Not a conflict to force through — the reason itself has gone. Redraw
      // so the card shows as spent instead of leaving a dead button.
      await loadAll();
      toast(e.message, "bad");
      return;
    }
    if (e.code === "proposal_conflict") {
      toast(e.message, "bad", {
        label: "Use Alfred's version",
        fn: async () => {
          try {
            await api("/api/proposals/" + encodeURIComponent(p.proposal_id) + "/approve",
              { method: "POST", body: { force: true } });
            await loadAll();
            toast("Approved, replacing your edit.");
          } catch (e2) { toast(e2.message, "bad"); }
        }
      });
      return;
    }
    if (!quiet) toast(e.message, "bad");
  }
}

async function rejectProposal(p, quiet) {
  try {
    await api("/api/proposals/" + encodeURIComponent(p.proposal_id) + "/reject",
      { method: "POST", body: { reason: "user rejected" } });
    if (!quiet) { await loadAll(); toast("Dismissed. Alfred won't suggest that again."); }
  } catch (e) { if (!quiet) toast(e.message, "bad"); }
}

/* ------------------------------------------------------------------- push */
async function openPushDrawer(uids) {
  S.drawer = "push";
  S.pushPreview = { loading: true };
  render();
  const r = viewRange();
  try {
    const job = await api("/api/push", {
      method: "POST",
      body: {
        start: r.start, end: r.end, dry_run: true,
        select: uids && uids.length ? "explicit" : "push_approved",
        uids: uids && uids.length ? uids : null
      }
    });
    S.pushPreview = { job, range: r, uids: uids || null };
  } catch (e) {
    S.pushPreview = { error: e };
  }
  render();
}

function pushDrawer() {
  const back = el("div", "backdrop");
  back.onclick = () => { S.drawer = null; render(); };
  const d = el("aside", "drawer");
  d.setAttribute("role", "dialog");
  d.setAttribute("aria-label", "Push to Garmin");

  const h = el("div", "drawer-h");
  h.appendChild(el("h3", null, "Send to Garmin"));
  h.appendChild(el("span", "spacer"));
  const x = el("button", "iconbtn");
  x.appendChild(svg("g-x", null));
  x.setAttribute("aria-label", "Close");
  x.onclick = () => { S.drawer = null; render(); };
  h.appendChild(x);
  d.appendChild(h);

  const b = el("div", "drawer-b");
  const p = S.pushPreview || {};
  const job = S.pushJob || p.job;

  // Writes are opt-in per machine. Say so up front, in the drawer whose whole
  // purpose is writing, rather than letting Send fail with a code.
  const off = writesBlockedReason();
  if (off) {
    const bn = el("div", "banner warn");
    bn.appendChild(svg("g-warn", null));
    const c = el("div");
    c.appendChild(el("span", "bt", "Sending to Garmin is switched off"));
    c.appendChild(document.createTextNode(off));
    bn.appendChild(c);
    b.appendChild(bn);
  }

  if (p.loading) {
    b.appendChild(el("div", "tile-sub", "Working out what would be sent…"));
  } else if (p.error) {
    const bn = el("div", "banner bad");
    bn.appendChild(svg("g-warn", null));
    bn.appendChild(el("div", null, p.error.message));
    b.appendChild(bn);
  } else if (job) {
    const items = job.items || [];
    if (!items.length) {
      b.appendChild(el("div", "tile-sub",
        "Nothing is approved for push yet. Open a workout's ⋮ menu and choose "
        + "“Approve for push”, then come back."));
    }
    items.forEach(it => {
      const row = el("div", "pushrow");
      const t = el("div", "pushrow-t");
      const state = it.state === "done" ? "done" : it.state === "failed" ? "failed" : (it.action || "");
      t.appendChild(el("span", "actionchip " + state, it.state === "done" ? "sent"
        : it.state === "failed" ? "failed" : (it.action || "")));
      t.appendChild(el("span", "pt", it.title));
      t.appendChild(el("span", "loadlab", shortDay(it.date) + " " + dayNum(it.date)));
      row.appendChild(t);
      // The honesty component: the ICS has no structured steps, so most
      // sessions land as a timed placeholder. Say so BEFORE it reaches the bike.
      if (it.reason) row.appendChild(el("div", "pushrow-r", it.reason));
      // A row that reports a copy still on the calendar has to be actionable
      // from here. Sending is not what clears it — removal is.
      if (it.on_garmin && it.action === "skip") {
        const rmw = findWorkout(it.uid);
        const blocked = removeBlockedReason();
        const rm = el("button", "btn sm", "Remove from Garmin");
        rm.style.marginTop = "6px";
        rm.title = blocked || "Unschedules this app's copy. The workout stays "
          + "in your Garmin library.";
        rm.disabled = !!blocked || !rmw;
        rm.onclick = () => removeFromGarmin(rmw || { uid: it.uid });
        row.appendChild(rm);
      }
      if (it.error) {
        const e = el("div", "pushrow-r");
        e.style.color = "var(--status-critical)";
        e.textContent = it.error.message || String(it.error);
        row.appendChild(e);
      }
      b.appendChild(row);
    });

    // Approving a change and sending it are two separate consents, so a
    // session that wasn't approved is never sent. It is listed above with its
    // reason; this is the count, so "I asked for the week and four went" is
    // never a silent answer.
    const held = (job.not_approved || {}).count || 0;
    if (held) {
      const bn = el("div", "banner");
      bn.appendChild(svg("g-warn", null));
      const c = el("div");
      c.appendChild(el("span", "bt", held === 1
        ? "1 session wasn't sent — you haven't approved it"
        : held + " sessions weren't sent — you haven't approved them"));
      c.appendChild(document.createTextNode(
        "Approving a change and sending it to the Edge are two separate steps. "
        + "Use a workout's ⋮ menu → “Approve for push” to include it."));
      bn.appendChild(c);
      b.appendChild(bn);
    }

    if (job.state === "running" || job.state === "queued") {
      const pr = el("div", "banner");
      pr.appendChild(svg("g-up", null));
      const c = el("div");
      c.style.flex = "1";
      c.appendChild(el("span", "bt", "Sending… " + (job.progress ? job.progress.done + " of " + job.progress.total : "")));
      const bar = el("div", "progress");
      const s = el("span");
      s.style.width = job.progress && job.progress.total
        ? Math.round(100 * job.progress.done / job.progress.total) + "%" : "5%";
      bar.appendChild(s);
      c.appendChild(bar);
      pr.appendChild(c);
      b.appendChild(pr);
    }
    if (job.state === "done" || job.state === "partial" || job.state === "failed") {
      const sum = job.summary || {};
      const kind = sum.failed ? "warn" : "";
      const bn = el("div", "banner " + kind);
      bn.appendChild(svg(sum.failed ? "g-warn" : "g-check", null));
      const c = el("div");
      if (!job.dry_run) {
        c.appendChild(el("span", "bt",
          "Sent " + ((sum.created || 0) + (sum.rescheduled || 0) + (sum.updated || 0)) + " to Garmin"
          + (sum.failed ? ", " + sum.failed + " failed" : "")));
        c.appendChild(document.createTextNode(
          "Sync your Edge 520 with Garmin Connect to get these on the device."));
      } else {
        c.appendChild(el("span", "bt", "Nothing sent yet — this is a preview."));
        c.appendChild(document.createTextNode(
          "Most sessions go over as a timed placeholder, because the TrainingPeaks feed "
          + "carries text, not power targets."));
      }
      bn.appendChild(c);
      b.appendChild(bn);
    }
  }
  d.appendChild(b);

  const f = el("div", "drawer-f");
  const cancel = el("button", "btn", "Close");
  cancel.onclick = () => { S.drawer = null; render(); };
  const send = el("button", "btn primary", "Send to Garmin");
  const running = job && (job.state === "running" || job.state === "queued");
  const sendable = job && (job.items || []).some(i => i.state !== "skipped");
  send.disabled = !sendable || running || (job && !job.dry_run)
    || !canPush() || !canWrite();
  if (!canPush()) send.title = "Garmin isn't connected — add your login to .env to send for real.";
  else if (!canWrite()) send.title = writesBlockedReason();
  else if (!sendable) send.title = "Nothing here is approved and due to be sent.";
  send.onclick = () => confirmPush();
  f.appendChild(cancel);
  f.appendChild(el("span", "spacer"));
  f.appendChild(send);
  d.appendChild(f);

  const frag = document.createDocumentFragment();
  frag.appendChild(back);
  frag.appendChild(d);
  return frag;
}

async function confirmPush() {
  const p = S.pushPreview || {};
  const r = p.range || { start: S.anchor, end: addDays(S.anchor, 6) };
  try {
    const job = await api("/api/push", {
      method: "POST",
      body: {
        start: r.start, end: r.end, dry_run: false,
        select: p.uids && p.uids.length ? "explicit" : "push_approved",
        uids: p.uids || null
      }
    });
    S.pushJob = job;
    S.pushPreview = { job, range: r, uids: p.uids };
    render();
    pollPush(job.job_id);
  } catch (e) {
    if (e.code === "push_in_flight" && e.detail && e.detail.job_id) {
      pollPush(e.detail.job_id);
      return;
    }
    if (e.code === "writes_disabled") {
      // Refresh capabilities so the drawer redraws with the banner and a
      // disabled Send, instead of leaving a button that can only fail.
      try { S.status = await api("/api/status"); } catch (ignored) { /* keep the old one */ }
    }
    S.pushPreview = Object.assign({}, S.pushPreview, { error: e });
    render();
  }
}

function pollPush(jobId) {
  clearTimeout(S.pollTimer);
  const tick = async () => {
    try {
      const job = await api("/api/push/" + encodeURIComponent(jobId));
      S.pushJob = job;
      if (S.pushPreview) S.pushPreview.job = job;
      render();
      if (job.state === "running" || job.state === "queued") {
        S.pollTimer = setTimeout(tick, 1200);
      } else {
        await loadAll();
        const sum = job.summary || {};
        announce("Push finished.");
        if (sum.failed) toast(sum.failed + " workout(s) failed to send — see the drawer.", "bad");
        else toast("On Garmin. Sync your Edge 520 to get them on the bike.");
      }
    } catch (e) {
      toast(e.message, "bad");
    }
  };
  tick();
}

/* -------------------------------------------------------------- help drawer */
function helpDrawer() {
  const back = el("div", "backdrop");
  back.onclick = () => { S.drawer = null; render(); };
  const d = el("aside", "drawer");
  d.setAttribute("role", "dialog");
  d.setAttribute("aria-label", "Keyboard shortcuts");
  const h = el("div", "drawer-h");
  h.appendChild(el("h3", null, "Keyboard"));
  h.appendChild(el("span", "spacer"));
  const x = el("button", "iconbtn");
  x.appendChild(svg("g-x", null));
  x.onclick = () => { S.drawer = null; render(); };
  h.appendChild(x);
  d.appendChild(h);
  const b = el("div", "drawer-b");
  const g = el("div", "helpgrid");
  [["← →", "Previous / next week"],
   ["T", "Table view — every value, no colour needed"],
   ["U", "Mark the focused day unavailable"],
   ["Space", "Pick up the focused workout, then ← → to move it, Space to drop"],
   ["Esc", "Cancel a pick-up / close a panel"],
   ["A / R", "Approve / reject the selected suggestion"],
   ["P", "Open the push drawer"],
   ["?", "This list"]].forEach(([k, v]) => {
    g.appendChild(el("span", "kbd", k));
    g.appendChild(el("span", null, v));
  });
  b.appendChild(g);
  b.appendChild(el("div", "tile-sub",
    "Drag and drop works with a mouse. On a phone, use a card's ⋮ menu → Move to."));
  d.appendChild(b);
  const frag = document.createDocumentFragment();
  frag.appendChild(back);
  frag.appendChild(d);
  return frag;
}

/* ============================================================== keyboard */
document.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;

  if (ev.key === "Escape") {
    if (S._popover) { closePopover(); return; }
    if (S.carry) { S.carry = null; render(); announce("Cancelled."); return; }
    if (S.drawer) { S.drawer = null; render(); return; }
    if (S.railOpen) { S.railOpen = false; render(); return; }
    return;
  }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;

  const focusedCard = document.activeElement && document.activeElement.closest
    ? document.activeElement.closest(".card") : null;

  if (ev.key === " " || ev.key === "Spacebar") {
    if (focusedCard && focusedCard.dataset.uid) {
      ev.preventDefault();
      if (S.carry === focusedCard.dataset.uid) {
        S.carry = null; render(); announce("Dropped.");
      } else {
        S.carry = focusedCard.dataset.uid;
        render();
        announce("Picked up. Use left and right arrows to choose a day, then space to drop.");
      }
      return;
    }
  }
  if ((ev.key === "ArrowLeft" || ev.key === "ArrowRight")) {
    if (S.carry) {
      ev.preventDefault();
      const w = findWorkout(S.carry);
      if (w) {
        const target = addDays(w.date, ev.key === "ArrowRight" ? 1 : -1);
        moveWorkout(S.carry, target);
        announce("Moved to " + longDay(target) + ".");
      }
      return;
    }
    ev.preventDefault();
    step(ev.key === "ArrowRight" ? 1 : -1);
    return;
  }
  const k = ev.key.toLowerCase();
  if (k === "t") { S.table = !S.table; render(); }
  else if (k === "u") { const d = S.focusDate; if (d) toggleAvailability(d, document.querySelector('[data-date="' + d + '"] .dayhead') || document.body); }
  else if (k === "p") { if (approvedCount()) openPushDrawer(); }
  // Only a *pending* proposal is decidable — an unplaceable session has
  // nothing to approve or reject, so the shortcuts skip it.
  else if (k === "a") { const p = selectedPending(); if (p) approveProposal(p); }
  else if (k === "r") {
    const p = selectedPending() || selectedStale();
    if (p) rejectProposal(p);
  }
  else if (ev.key === "?") { S.drawer = "help"; render(); }
});

/* ================================================================ wiring */
function step(dir) {
  S.anchor = S.view === "week"
    ? addDays(S.anchor, 7 * dir)
    : iso(new Date(parseISO(S.anchor).getFullYear(), parseISO(S.anchor).getMonth() + dir, 1));
  S.focusDate = S.anchor;
  loadAll();
}
$("#prev").onclick = () => step(-1);
$("#next").onclick = () => step(1);
$("#today").onclick = () => {
  S.anchor = S.view === "week" ? mondayOf(todayISO()) : todayISO();
  S.focusDate = todayISO();
  loadAll();
};
$("#v-week").onclick = () => {
  if (S.view === "week") return;
  S.view = "week"; S.table = false;
  S.anchor = mondayOf(S.anchor);
  loadAll();
};
$("#v-month").onclick = () => {
  if (S.view === "month") return;
  S.view = "month"; S.table = false;
  loadAll();
};
$("#feedpill").onclick = async () => {
  S.fetching = true; render();
  try { await api("/api/refresh", { method: "POST", body: { sources: ["trainingpeaks_ics", "garmin"] } }); }
  catch (e) { /* the source state itself will report the failure */ }
  await loadAll(true);
};
$("#themebtn").onclick = () => {
  S.theme = S.theme === "auto" ? "light" : S.theme === "light" ? "dark" : "auto";
  saveLocal();
  render();
  announce("Theme: " + S.theme);
};
$("#railbtn").onclick = () => { S.railOpen = !S.railOpen; render(); };
$("#pushbtn").onclick = () => openPushDrawer();
window.addEventListener("resize", () => { renderRail(); });

/* ------------------------------------------------------------------- boot */
loadLocal();              // render whatever we had, instantly — offline-first
render();
loadAll();
</script>
</body>
</html>
