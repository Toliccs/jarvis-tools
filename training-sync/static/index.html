<script>
"use strict";

/* =========================================================================
   Training Calendar front-end.

   Backend contract (all read/written here):
     GET    /api/status
     POST   /api/refresh
     GET    /api/calendar?start&end&include_proposals
     PUT    /api/days/{date}/availability      {state,note,max_minutes}
     DELETE /api/days/{date}/availability
     POST   /api/workouts/{uid}/move           {to_date,expected_rev,allow_unavailable}
     PATCH  /api/workouts/{uid}                {push_approved,status,...}
     DELETE /api/workouts/{uid}/override
     POST   /api/workouts/{uid}/unpush
     POST   /api/proposals                     {start,end,reason}
     POST   /api/proposals/{id}/approve        {force}
     POST   /api/proposals/{id}/reject         {reason}
     POST   /api/push                          {start,end,select,dry_run}
     GET    /api/push/{job_id}

   TrainingPeaks is never written to. Every write below targets the local
   override store or Garmin Connect.

   Sending to Garmin needs three separate consents, and this file must never
   collapse them: the account is connected (credentials), this machine is
   allowed to write at all (TRAINING_SYNC_ALLOW_GARMIN_WRITES — surfaced as
   capabilities.can_write_to_garmin), and that particular session is approved
   (push_approved). A preview needs none of them and always works.

   Removal (/unpush) is a Garmin write too and is gated the same way, minus
   push_approved: it is only ever offered on a session this app actually put
   there (garmin.on_garmin), and only ever when the athlete asks. Skipping or
   dropping a session never removes anything by itself — it says the copy is
   still on the calendar and offers the way off.
   ========================================================================= */

const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const svg = (id, cls) => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  if (cls) s.setAttribute("class", cls);
  s.setAttribute("aria-hidden", "true");
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", "#" + id);
  s.appendChild(u);
  return s;
};

/* ------------------------------------------------------------------ dates */
const DAYNAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const iso = d => {
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
};
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const mondayOf = s => { const d = parseISO(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); };
const dowIndex = s => (parseISO(s).getDay() + 6) % 7;      // 0 = Monday
const todayISO = () => iso(new Date());
const shortDay = s => DAYNAMES[dowIndex(s)];
const longDay = s => ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][dowIndex(s)];
const dayNum = s => parseISO(s).getDate();
const monName = s => MONTHS[parseISO(s).getMonth()];

function rangeLabel() {
  if (S.view === "month") {
    const d = parseISO(S.anchor);
    return MONTHS[d.getMonth()] + " " + d.getFullYear();
  }
  const a = S.anchor, b = addDays(a, 6);
  const sameMonth = parseISO(a).getMonth() === parseISO(b).getMonth();
  return sameMonth
    ? monName(a) + " " + dayNum(a) + " – " + dayNum(b)
    : monName(a) + " " + dayNum(a) + " – " + monName(b) + " " + dayNum(b);
}
/* Whole weeks covering the month, so the grid is always rectangular. */
function monthGridRange() {
  const d = parseISO(S.anchor);
  const first = iso(new Date(d.getFullYear(), d.getMonth(), 1));
  const last = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  return { start: mondayOf(first), end: addDays(mondayOf(last), 6) };
}
/* The range the current view needs from /api/calendar. */
function viewRange() {
  return S.view === "week"
    ? { start: S.anchor, end: addDays(S.anchor, 6) }
    : monthGridRange();
}

function ago(ts) {
  if (!ts) return "never";
  const t = Date.parse(ts.endsWith("Z") || ts.includes("+") ? ts : ts + "Z");
  if (isNaN(t)) return "unknown";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  const h = Math.round(m / 60);
  if (h < 36) return h + "h ago";
  return Math.round(h / 24) + "d ago";
}

/* ------------------------------------------------------------ encoding maps */
/* Ordinal ramp: 4 steps. The engine has 7 intensity classes, so the ramp step
   carries "how hard", the WORD carries which class, and the meter agrees with
   the step. Intensity is never color-alone. */
const INTENSITY = {
  REST:      { step: "rest",     word: "Rest",      segs: 0 },
  RECOVERY:  { step: "easy",     word: "Recovery",  segs: 1 },
  ENDURANCE: { step: "easy",     word: "Endurance", segs: 1 },
  TEMPO:     { step: "moderate", word: "Tempo",     segs: 2 },
  THRESHOLD: { step: "hard",     word: "Threshold", segs: 3 },
  VO2:       { step: "hard",     word: "VO2",       segs: 4 },
  RACE:      { step: "hard",     word: "Race",      segs: 4 },
  UNKNOWN:   { step: "unknown",  word: "Unknown",   segs: 0 }
};
const RAMP = {
  rest: "var(--ramp-rest)", easy: "var(--ramp-easy)",
  moderate: "var(--ramp-moderate)", hard: "var(--ramp-hard)",
  unknown: "var(--ink-muted)"
};
const SPORT_GLYPH = {
  cycling: "g-bike", running: "g-run", swimming: "g-swim",
  strength: "g-strength", other: "g-dot", unknown: "g-dot"
};

function intensityOf(w) {
  const c = w.classification || {};
  const key = (c.intensity || "UNKNOWN").toUpperCase();
  return INTENSITY[key] || INTENSITY.UNKNOWN;
}
function glyphOf(w) {
  if (intensityOf(w).step === "rest") return "g-rest";
  return SPORT_GLYPH[w.sport] || "g-dot";
}
function fmtDur(secs) {
  if (!secs) return null;
  const m = Math.round(secs / 60);
  if (m < 60) return m + " min";
  return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
}
/* The app never shows a bare number it guessed:
     explicit TSS      -> "82 TSS"
     derived, medium   -> "~82 TSS"
     derived, low      -> "~82 TSS?"  dotted underline + the matched source text */
function tssOf(w) {
  const c = w.classification || {};
  const v = w.planned_tss;
  if (v == null) return null;
  const n = Math.round(v);
  // "0 TSS" on a rest day is noise, not information.
  if (!n) return null;
  if (c.tss != null) return { text: n + " TSS", low: false };
  const lc = (c.load_confidence || "NONE").toUpperCase();
  if (lc === "HIGH") return { text: n + " TSS", low: false };
  if (lc === "MED") return { text: "~" + n + " TSS", low: false, hint: "Estimated from duration and intensity." };
  return {
    text: "~" + n + " TSS?", low: true,
    hint: "Rough estimate — the feed didn't state a TSS."
      + ((c.evidence && c.evidence.length) ? " Read from: " + c.evidence.join(", ") : "")
  };
}
/* `no_structure` is true of nearly every ICS workout — it is the norm, not a
   conflict. Badging it would make every day warn and destroy the signal. It is
   surfaced honestly in the push preview instead. */
const CONFLICT_TEXT = {
  day_unavailable: "on a day you marked unavailable",
  double_booked: "two sessions on one day",
  past_date: "in the past"
};
const realConflicts = w => (w.conflicts || []).filter(c => CONFLICT_TEXT[c]);

/* --------------------------------------------------------------- app state */
const S = {
  view: "week",
  anchor: mondayOf(todayISO()),
  theme: "auto",
  status: null,
  cal: null,
  signal: null,          // trailing 7-day window, for the rail
  error: null,
  fetching: false,
  selectedProposal: null,
  dragUid: null,         // pointer drag: uid in flight
  carry: null,           // keyboard drag: uid being carried
  focusDate: todayISO(),
  pushJob: null,
  pushPreview: null,
  drawer: null,          // 'push' | 'help' | null
  railOpen: false,
  table: false,
  toast: null,
  pollTimer: null
};

const LS = "training-calendar-v1";
function saveLocal() {
  try {
    localStorage.setItem(LS, JSON.stringify({
      view: S.view, anchor: S.anchor, theme: S.theme,
      cal: S.cal, signal: S.signal, status: S.status, at: Date.now()
    }));
  } catch (e) { /* quota / private mode — the app still works, just not offline */ }
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.theme) S.theme = d.theme;
    if (d.view) S.view = d.view;
    // Anchor on today, not on wherever the user last was.
    if (d.cal) S.cal = d.cal;
    if (d.signal) S.signal = d.signal;
    if (d.status) S.status = d.status;
  } catch (e) { /* corrupt cache is not fatal — we just refetch */ }
}

/* ------------------------------------------------------------------- fetch */
class ApiError extends Error {
  constructor(code, message, detail, httpStatus) {
    super(message); this.code = code; this.detail = detail || {}; this.httpStatus = httpStatus;
  }
}
async function api(path, opts) {
  const o = Object.assign({ headers: {} }, opts || {});
  if (o.body != null && typeof o.body !== "string") {
    o.headers["Content-Type"] = "application/json";
    o.body = JSON.stringify(o.body);
  }
  let res;
  try {
    res = await fetch(path, o);
  } catch (e) {
    throw new ApiError("network", "Can't reach the training-sync server. Is it running?", {}, 0);
  }
  let data = null;
  const text = await res.text();
  if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
  if (!res.ok) {
    const err = (data && data.error) || {};
    throw new ApiError(err.code || "http_" + res.status,
      err.message || ("Request failed (" + res.status + ")."), err.detail, res.status);
  }
  return data;
}

async function loadAll(force) {
  S.fetching = true;
  render();
  const r = viewRange();
  try {
    const [status, cal] = await Promise.all([
      api("/api/status"),
      api("/api/calendar?start=" + r.start + "&end=" + r.end + "&include_proposals=true")
    ]);
    S.status = status;
    S.cal = cal;
    S.error = null;
    // Trailing 7 days feeds the rail: readiness is a today-signal and "7-day
    // load" means the last 7 days, not whichever week is on screen.
    const sEnd = todayISO(), sStart = addDays(sEnd, -6);
    if (sStart >= r.start && sEnd <= r.end) {
      S.signal = { start: sStart, end: sEnd, days: cal.days, training_status: cal.training_status };
    } else {
      try {
        const sig = await api("/api/calendar?start=" + sStart + "&end=" + sEnd + "&include_proposals=false");
        S.signal = { start: sStart, end: sEnd, days: sig.days, training_status: sig.training_status };
      } catch (e) { /* rail degrades to "no data"; the calendar still renders */ }
    }
  } catch (e) {
    // Never a blank page: keep the last render and say what went wrong.
    S.error = e;
  } finally {
    S.fetching = false;
    saveLocal();
    render();
  }
}

/* ------------------------------------------------------------------ helpers */
function dayByDate(d) {
  if (!S.cal) return null;
  return (S.cal.days || []).find(x => x.date === d) || null;
}
function allWorkouts() {
  if (!S.cal) return [];
  return (S.cal.days || []).reduce((a, d) => a.concat(d.workouts || []), []);
}
/* Pending suggestions *and* the sessions Alfred couldn't place. The unplaceable
   ones carry status "unresolved", so every `status === "pending"` filter below
   ignores them — they are visible, never approvable. */
function allProposals() {
  if (!S.cal) return [];
  return (S.cal.days || []).reduce(
    (a, d) => a.concat(d.proposals || [], d.unresolved || []), []);
}
function allUnresolved() {
  if (!S.cal) return [];
  return (S.cal.days || []).reduce((a, d) => a.concat(d.unresolved || []), []);
}
function selectedPending() {
  // Decidable means pending *and* still standing: a suggestion whose reason
  // has gone is refused by the backend, so the keyboard must not offer it
  // either.
  return allProposals().find(
    p => p.proposal_id === S.selectedProposal && p.status === "pending"
      && !p.stale) || null;
}
function selectedStale() {
  return allProposals().find(
    p => p.proposal_id === S.selectedProposal && p.stale) || null;
}
function approvedCount() {
  return allWorkouts().filter(w => w.push_approved && w.status !== "skipped").length;
}
function findWorkout(uid) {
  return allWorkouts().find(w => w.uid === uid) || null;
}
const isDemo = () => !!(S.status && S.status.demo) || !!(S.cal && S.cal.demo);
const caps = () => (S.status && S.status.capabilities) || {};
const canPush = () => !!caps().can_push_to_garmin;
/* Credentials say a push is possible; the opt-in says it's intended. Both are
   needed to send for real, and only the preview works without the second. */
const canWrite = () => !!caps().can_write_to_garmin;
const writesBlockedReason = () =>
  (canPush() && !canWrite()) ? (caps().garmin_writes_disabled_reason
    || "Writing to Garmin is switched off on this machine.") : null;

function toast(msg, kind, action) {
  S.toast = { msg, kind, action, id: Date.now() };
  render();
  const id = S.toast.id;
  setTimeout(() => { if (S.toast && S.toast.id === id) { S.toast = null; render(); } }, 8000);
}
function announce(msg) { $("#live").textContent = msg; }

/* ========================================================================== */
/*  RENDER                                                                     */
/* ========================================================================== */
function render() {
  document.documentElement.setAttribute("data-theme", S.theme);
  $("#rangelabel").textContent = rangeLabel();
  $("#v-week").setAttribute("aria-pressed", String(S.view === "week"));
  $("#v-month").setAttribute("aria-pressed", String(S.view === "month"));
  renderFeedPill();
  renderContextRow();
  renderBanners();
  renderGrid();
  renderRail();
  renderChangeBar();
  renderOverlays();
  const n = approvedCount();
  const pb = $("#pushbtn");
  pb.textContent = n ? "Push " + n + " to Garmin" : "Push to Garmin";
  pb.disabled = !n || !S.cal;
  pb.title = !n ? "Approve at least one workout for push first (card menu → Approve for push)."
    : (canPush() ? "" : "Garmin isn't configured — you can still preview what would be sent.");
}

function renderFeedPill() {
  const pill = $("#feedpill"), t = $("#feedtext");
  pill.className = "pill";
  const src = S.status && S.status.sources && S.status.sources.trainingpeaks_ics;
  if (S.fetching) { t.textContent = "refreshing…"; return; }
  if (S.error) { pill.classList.add("bad"); t.textContent = "offline"; return; }
  if (!src) { t.textContent = "—"; return; }
  if (!src.configured) { pill.classList.add("warn"); t.textContent = "feed not set up"; return; }
  if (!src.ok) { pill.classList.add("bad"); t.textContent = "feed error"; return; }
  if (src.stale) pill.classList.add("warn");
  t.textContent = "feed " + ago(src.last_success);
}

function renderContextRow() {
  const row = $("#contextrow");
  row.textContent = "";
  if (!S.cal) return;

  const ws = allWorkouts();
  const tss = ws.reduce((a, w) => a + (typeof w.planned_tss === "number" ? w.planned_tss : 0), 0);
  const unsized = ws.filter(w => w.planned_tss == null).length;
  const conflicts = ws.filter(w => realConflicts(w).length).length;
  const pending = allProposals().filter(p => p.status === "pending").length;

  const add = (node) => row.appendChild(node);
  const item = (label, value, cls) => {
    const s = el("span", "ctx-item" + (cls ? " " + cls : ""));
    if (value != null) { const b = el("b", null, value); s.appendChild(b); }
    s.appendChild(document.createTextNode(label));
    return s;
  };

  add(item(S.view === "week" ? " sessions this week" : " sessions this month", String(ws.length)));
  add(el("span", "ctx-sep"));
  add(item(unsized ? " TSS planned (" + unsized + " unsized)" : " TSS planned", Math.round(tss)));

  if (conflicts) {
    add(el("span", "ctx-sep"));
    const c = el("span", "ctx-item ctx-warn");
    c.appendChild(svg("g-warn", "glyph"));
    c.appendChild(document.createTextNode(conflicts + (conflicts === 1 ? " conflict" : " conflicts")));
    add(c);
  }
  if (pending) {
    add(el("span", "ctx-sep"));
    const p = el("span", "ctx-item");
    p.style.color = "var(--accent)";
    p.appendChild(svg("g-spark", "glyph"));
    p.appendChild(document.createTextNode(pending + " suggested " + (pending === 1 ? "change" : "changes")));
    add(p);
  }

  add(el("span", "spacer"));

  if (isDemo()) {
    const d = el("span", "pill demo");
    d.appendChild(document.createTextNode("Demo data"));
    d.title = "Sample plan and sample Garmin signal. Nothing is ever sent to Garmin in demo mode.";
    add(d);
  }
  const ask = el("button", "btn sm", "Ask Alfred");
  ask.title = "Look at this week and suggest changes";
  ask.onclick = () => requestProposals("manual");
  add(ask);

  const tv = el("button", "btn sm", S.table ? "Calendar" : "Table view");
  tv.title = "Every value on screen, as a table (keyboard: T)";
  tv.onclick = () => { S.table = !S.table; render(); };
  add(tv);
}

function renderBanners() {
  const box = $("#banners");
  box.textContent = "";

  const banner = (kind, glyph, title, body, actions) => {
    const b = el("div", "banner " + (kind || ""));
    b.appendChild(svg(glyph, null));
    const c = el("div");
    if (title) c.appendChild(el("span", "bt", title));
    if (body) {
      const p = el("span");
      p.innerHTML = body;
      c.appendChild(p);
    }
    b.appendChild(c);
    if (actions && actions.length) {
      const a = el("div", "ba");
      actions.forEach(x => a.appendChild(x));
      b.appendChild(a);
    }
    box.appendChild(b);
    return b;
  };

  if (S.error) {
    const retry = el("button", "btn sm", "Retry");
    retry.onclick = () => loadAll(true);
    banner("bad", "g-warn", "Couldn't reach the server",
      escapeHtml(S.error.message) + (S.cal ? " Showing the last plan you loaded." : ""), [retry]);
  }

  const src = S.status && S.status.sources;
  if (src && !src.trainingpeaks_ics.configured) {
    banner("warn", "g-info", "TrainingPeaks feed isn't connected",
      "Add your personal calendar-feed URL as <code>TRAININGPEAKS_CALENDAR_FEED_URL</code> in "
      + "<code>training-sync/.env</code>, then hit refresh. "
      + "To look around first, restart the server with <code>--demo</code>.");
  }
  if (src && src.garmin && !src.garmin.configured) {
    banner("warn", "g-info", "Garmin isn't connected",
      "You can plan and move sessions, but nothing can be sent to your Edge 520 until "
      + "<code>GARMIN_EMAIL</code> and <code>GARMIN_PASSWORD</code> are in <code>training-sync/.env</code>.");
  } else if (src && src.garmin && src.garmin.configured && !src.garmin.ok) {
    banner("bad", "g-warn", "Can't reach Garmin", escapeHtml(src.garmin.message || "Login failed."));
  }
  // Connected, but this machine hasn't been told it may write. Standing
  // notice, not a surprise at the moment of sending.
  if (writesBlockedReason() && !isDemo()) {
    banner("warn", "g-info", "Sending to Garmin is switched off",
      "Nothing here can reach your Garmin account. Previews still work. "
      + "To enable sending, set <code>TRAINING_SYNC_ALLOW_GARMIN_WRITES=1</code> in "
      + "<code>training-sync/.env</code> and restart.");
  }

  // The richer "isn't connected" banners above already cover these codes —
  // echoing the backend's version too just says the same thing twice.
  const covered = new Set(["ics_not_configured", "garmin_not_configured"]);
  ((S.cal && S.cal.warnings) || []).forEach(w => {
    if (covered.has(w.code)) return;
    banner("warn", "g-warn", null, escapeHtml(w.message || ""));
  });

  const orphans = (S.cal && S.cal.orphans) || [];
  if (orphans.length) {
    banner("warn", "g-info", orphans.length + " workout" + (orphans.length > 1 ? "s" : "") + " removed in TrainingPeaks",
      "Your changes to " + orphans.map(o => "<b>" + escapeHtml(o.title) + "</b>").join(", ")
      + " are kept — the coach's plan no longer has them.");
  }
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* ------------------------------------------------------------------- grid */
function renderGrid() {
  const g = $("#grid");
  g.textContent = "";

  if (!S.cal) {
    if (!S.error) {
      const e = el("div", "emptystate");
      e.appendChild(el("h2", null, "Loading your plan…"));
      g.appendChild(e);
    }
    return;
  }
  if (S.table) { g.appendChild(tableView()); return; }
  g.appendChild(S.view === "week" ? weekGrid() : monthGrid());
}

function weekGrid() {
  const wrap = el("div", "weekgrid");
  const today = todayISO();
  for (let i = 0; i < 7; i++) {
    const date = addDays(S.anchor, i);
    wrap.appendChild(dayColumn(date, date === today));
  }
  return wrap;
}

function dayColumn(date, isToday) {
  const day = dayByDate(date) || { date, availability: { state: "available" }, workouts: [], proposals: [], load: {} };
  const unavailable = day.availability && day.availability.state === "unavailable";
  const limited = day.availability && day.availability.state === "limited";

  const col = el("div", "daycol" + (unavailable ? " unavailable" : "") + (isToday ? " today" : ""));
  col.dataset.date = date;

  /* --- header: click toggles availability. This is the core scenario —
         "I can't bike Tuesday because I have work but I can Wednesday". --- */
  const head = el("button", "dayhead");
  head.type = "button";
  head.setAttribute("aria-pressed", String(!!unavailable));
  head.title = unavailable
    ? "Marked unavailable — click to free the day up"
    : "Click to mark " + longDay(date) + " unavailable";

  const nameRow = el("div", "dayname");
  nameRow.appendChild(document.createTextNode(shortDay(date)));
  nameRow.appendChild(el("b", null, String(dayNum(date))));
  if (isToday) {
    const t = el("span", "chip", "Today");
    t.style.marginLeft = "auto";
    nameRow.appendChild(t);
  }
  head.appendChild(nameRow);

  const foot = el("div", "dayfoot");
  const tss = day.load && day.load.planned_tss;
  if (tss) foot.appendChild(el("span", "daytss", Math.round(tss) + " TSS"));

  if (unavailable || limited) {
    const gl = el("span", "availglyph");
    gl.appendChild(svg("g-lock", null));
    gl.appendChild(document.createTextNode(
      limited ? ("≤" + (day.availability.max_minutes || "?") + "m")
        : (day.availability.note || "Unavailable")));
    foot.appendChild(gl);
  }

  const conflicts = new Set();
  (day.workouts || []).forEach(w => realConflicts(w).forEach(c => conflicts.add(c)));
  conflicts.delete("day_unavailable");             // the hatch already says this
  if (conflicts.size) {
    const cb = el("span", "conflictbadge");
    cb.appendChild(svg("g-warn", null));
    cb.appendChild(document.createTextNode(
      Array.from(conflicts).map(c => CONFLICT_TEXT[c]).join(" · ")));
    foot.appendChild(cb);
  }
  if (foot.childNodes.length) head.appendChild(foot);

  head.onclick = (ev) => { ev.stopPropagation(); toggleAvailability(date, head); };
  col.appendChild(head);

  /* --- drop zone --- */
  const zone = el("div", "dropzone");
  zone.dataset.date = date;

  zone.addEventListener("dragover", ev => {
    if (!S.dragUid) return;
    ev.preventDefault();
    // Deliberately NOT dropEffect="none" on an unavailable day: that makes the
    // browser swallow the drop event, so the user drags, nothing happens, and
    // nothing explains why. The day is styled as blocked, the drop still lands,
    // and the move is refused with a reason and an "anyway" escape hatch.
    ev.dataTransfer.dropEffect = "move";
    zone.classList.add(unavailable ? "blocked" : "over");
  });
  zone.addEventListener("dragleave", () => zone.classList.remove("over", "blocked"));
  zone.addEventListener("drop", ev => {
    ev.preventDefault();
    zone.classList.remove("over", "blocked");
    const uid = ev.dataTransfer.getData("text/plain") || S.dragUid;
    if (!uid) return;
    if (unavailable) {
      const card = document.querySelector('[data-uid="' + cssEscape(uid) + '"]');
      if (card) { card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 200); }
    }
    moveWorkout(uid, date);
  });

  (day.workouts || []).forEach(w => zone.appendChild(workoutCard(w, day)));

  // Ghost stubs: a workout that lives elsewhere but was planned here.
  allWorkouts().forEach(w => {
    if (w.plan_date === date && w.date !== date) {
      const g = el("div", "ghost");
      g.appendChild(svg("g-right", "glyph"));
      g.appendChild(document.createTextNode(w.title + " → " + shortDay(w.date)));
      zone.appendChild(g);
    }
  });

  (day.proposals || []).filter(p => p.status === "pending")
    .forEach(p => zone.appendChild(proposalCard(p)));
  (day.unresolved || []).forEach(p => zone.appendChild(proposalCard(p)));

  if (!zone.childNodes.length) {
    zone.appendChild(el("div", "emptyday", unavailable ? "Blocked out" : "Rest"));
  }
  col.appendChild(zone);
  return col;
}

/* ------------------------------------------------------------ workout card */
function workoutCard(w, day) {
  const int = intensityOf(w);
  const card = el("article", "card");
  card.style.setProperty("--intensity", RAMP[int.step]);
  if (int.step === "unknown") card.classList.add("unknown-int");
  if (w.is_moved) card.classList.add("moved");
  if (w.push_approved) card.classList.add("approved");
  if (S.carry === w.uid) card.classList.add("carried");
  card.dataset.uid = w.uid;
  card.tabIndex = 0;

  /* HTML5 drag. Touch devices don't fire these — the card menu's "Move to…"
     and the keyboard path (Space to pick up) are the equivalents there. */
  card.draggable = true;
  card.addEventListener("dragstart", ev => {
    S.dragUid = w.uid;
    ev.dataTransfer.setData("text/plain", w.uid);
    ev.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
  });
  card.addEventListener("dragend", () => {
    S.dragUid = null;
    card.classList.remove("dragging");
    document.querySelectorAll(".dropzone").forEach(z => z.classList.remove("over", "blocked"));
  });

  const body = el("div", "card-body");
  body.appendChild(el("div", "card-bar"));
  const main = el("div", "card-main");

  const menu = el("button", "card-menu", "⋮");
  menu.setAttribute("aria-label", "Actions for " + w.title);
  menu.onclick = ev => { ev.stopPropagation(); openCardMenu(w, menu); };
  main.appendChild(menu);

  const top = el("div", "card-top");
  top.appendChild(el("h4", "card-title", w.title));
  main.appendChild(top);

  const meta = el("div", "card-meta");
  meta.appendChild(svg(glyphOf(w), "glyph"));
  const dur = fmtDur(w.duration_s);
  if (dur) {
    const c = w.classification || {};
    const approx = c.duration_source && c.duration_source !== "explicit";
    const d = el("span", "num", (approx ? "~" : "") + dur);
    if (approx) d.title = "Typical length for this kind of session — the feed didn't give one.";
    meta.appendChild(d);
  }
  const t = tssOf(w);
  if (t) {
    const ts = el("span", "num tss" + (t.low ? " low" : ""), t.text);
    if (t.hint) ts.title = t.hint;
    meta.appendChild(ts);
  }
  main.appendChild(meta);

  const iw = el("div", "intwrap");
  const meter = el("div", "meter");
  meter.setAttribute("role", "img");
  meter.setAttribute("aria-label", "Intensity: " + int.word);
  for (let i = 0; i < 4; i++) meter.appendChild(el("i", i < int.segs ? "on" : null));
  iw.appendChild(meter);
  iw.appendChild(el("span", "intword", int.word));
  main.appendChild(iw);

  if (w.is_moved) {
    const actor = w.override && w.override.kind === "alfred" ? "Alfred" : "you";
    const p = el("div", "card-prov");
    p.appendChild(document.createTextNode("⤷ moved from " + shortDay(w.plan_date) + " · " + actor));
    main.appendChild(p);
  }
  if (w.override && w.override.note) main.appendChild(el("div", "card-note", "“" + w.override.note + "”"));
  if (w.status === "skipped") {
    const s = el("div", "card-prov");
    s.appendChild(el("span", "chip", "Skipped"));
    main.appendChild(s);
  }
  if (w.plan_snapshot_changed) {
    const s = el("div", "card-prov");
    const c = el("span", "chip warn", "⚠ Coach changed this");
    c.title = "Your coach edited this workout after you moved it. Your date is kept.";
    s.appendChild(c);
    main.appendChild(s);
  }
  if (w.is_orphaned) {
    const s = el("div", "card-prov");
    s.appendChild(el("span", "chip warn", "Removed in TrainingPeaks"));
    main.appendChild(s);
  }

  body.appendChild(main);
  card.appendChild(body);

  // A pending proposal about this workout — flagged here, decided on the
  // dashed card sitting on its target day.
  const prop = allProposals().find(
    p => p.uid === w.uid && p.status === "pending" && !p.stale);
  if (prop && prop.to_date && prop.to_date !== w.date) {
    const strip = el("div", "suggest-strip");
    strip.appendChild(svg("g-spark", "glyph"));
    strip.appendChild(document.createTextNode("Alfred suggests → " + shortDay(prop.to_date)));
    card.appendChild(strip);
  }

  const push = pushInfo(w);
  if (push) {
    const ps = el("div", "card-push " + push.cls);
    ps.appendChild(document.createTextNode(push.text));
    if (push.retry) {
      const r = el("button", "rt", "Retry");
      r.style.textDecoration = "underline";
      r.onclick = ev => { ev.stopPropagation(); openPushDrawer([w.uid]); };
      ps.appendChild(r);
    }
    // A session he has taken off his week while a copy is still on the Edge
    // is the one case where the way out belongs on the card, not two clicks
    // into a menu — the badge states a problem, so it carries the fix.
    if (push.remove) {
      const r = el("button", "rt", "Remove");
      r.style.textDecoration = "underline";
      r.onclick = ev => { ev.stopPropagation(); removeFromGarmin(w); };
      ps.appendChild(r);
    }
    card.appendChild(ps);
  }

  card.addEventListener("focus", () => { S.focusDate = w.date; });
  return card;
}

/* Push outcome is its OWN region (bottom strip) with its own palette, never
   the border — the border belongs to provenance. */
function pushInfo(w) {
  const live = S.pushJob && (S.pushJob.items || []).find(i => i.uid === w.uid);
  if (live && S.pushJob.state === "running") {
    if (live.state === "pending") return { cls: "", text: "↻ Pushing…" };
  }
  if (live && live.state === "failed") {
    return { cls: "bad", text: "✕ Push failed — " + (live.error && live.error.message ? live.error.message : "Garmin rejected it"), retry: true };
  }
  const g = w.garmin || {};
  // Said first, because it is the only state where the calendar here and the
  // calendar on the Edge disagree: he has struck the session off his week and
  // a copy of it is still sitting on the device. Skipping is a local decision
  // and never unschedules anything, so the card has to say the copy is there.
  if (g.on_garmin && w.status === "skipped") {
    return { cls: "warn", text: "⚠ Skipped — still on your Garmin calendar", remove: true };
  }
  if (g.push_state === "scheduled") return { cls: "good", text: "✓ On Garmin · not yet synced to Edge" };
  if (g.push_state === "drifted") return { cls: "warn", text: "⚠ Changed since it was pushed" };
  if (g.push_state === "failed") return { cls: "bad", text: "✕ Push failed", retry: true };
  if (w.push_approved) return { cls: "", text: "↑ Approved for push" };
  return null;
}

/* ----------------------------------------------------------- proposal card */
/* One label per engine kind, in his words. The chip and the sentence under it
   must never say different things: a KEEP labelled "SKIP" reads as the exact
   opposite of "left where it is". */
const KIND_LABEL = {
  move: "MOVE", swap: "SWAP", merge: "FOLD IN", shorten: "SHORTEN",
  downgrade: "EASIER", skip: "SKIP", keep: "KEEP",
  no_proposal: "CAN'T PLACE"
};
const KIND_HINT = {
  move: "Same session, different day.",
  swap: "Two sessions trade days — they move together.",
  merge: "Two sessions become one.",
  shorten: "Same day, shorter.",
  downgrade: "Same day, easier session than your coach planned.",
  skip: "This session comes off the calendar.",
  keep: "Nothing moves — this is Alfred saying it's your call, not his.",
  no_proposal: "Alfred couldn't find a slot. Nothing has changed."
};

function proposalCard(p) {
  const stuck = p.status === "unresolved";
  // The reason printed on this card is no longer true — he cancelled the trip,
  // or moved the session himself. It may not be approved, and its old sentence
  // may not be shown as if it still stood.
  const stale = !stuck && !!p.stale;
  const card = el("article", "card proposal" + (stuck ? " unresolved" : "")
    + (stale ? " stale" : ""));
  if (S.selectedProposal === p.proposal_id) card.classList.add("selected");
  card.tabIndex = 0;
  card.dataset.proposal = p.proposal_id;
  card.style.setProperty("--intensity", stuck ? "var(--status-warning)" : "var(--accent)");

  const body = el("div", "card-body");
  body.appendChild(el("div", "card-bar"));
  const main = el("div", "card-main");

  // No inline glyph in the title row -- it competes with the title for a ~96px
  // column and forces mid-word breaks. The ✦ chip below carries the identity.
  const top = el("div", "card-top");
  top.appendChild(el("h4", "card-title", p.title || "Suggested change"));
  main.appendChild(top);

  const kind = p.kind || "move";
  const meta = el("div", "card-meta");
  const chip = el("span", "chip " + (stuck ? "warn" : "accent"),
    (stuck ? "⚠ " : "✦ ") + (KIND_LABEL[kind] || kind.toUpperCase()));
  if (KIND_HINT[kind]) chip.title = KIND_HINT[kind];
  meta.appendChild(chip);
  if (stale) {
    const s = el("span", "chip", "No longer applies");
    s.title = p.stale_reason || "The reason for this suggestion has gone.";
    meta.appendChild(s);
  }
  if (p.from_date && p.to_date && p.to_date !== p.from_date) {
    meta.appendChild(el("span", null, shortDay(p.from_date) + " → " + shortDay(p.to_date)));
  } else if (kind === "keep" && p.from_date) {
    meta.appendChild(el("span", null, "stays on " + shortDay(p.from_date)));
  }
  if (p.conflicts_with_override) {
    const c = el("span", "chip warn", "You edited this");
    c.title = "You've already moved this by hand. Approving replaces your change.";
    meta.appendChild(c);
  }
  main.appendChild(meta);

  // The reason, in his language. Mandatory and always rendered — but a stale
  // one is struck through and answered first, so the live sentence on the card
  // is the true one.
  if (stale) {
    main.appendChild(el("div", "prop-stale",
      p.stale_reason || "The reason for this suggestion has gone."));
  }
  main.appendChild(el("div", "prop-reason", p.rationale || "No reason given."));

  // A swap moves two sessions. Both are listed here, because approving is one
  // decision about all of them.
  const ops = (p.operations || []).filter(o => o.summary);
  if (ops.length > 1) {
    const list = el("div", "prop-ops");
    list.appendChild(el("div", "prop-ops-h", "This changes " + ops.length + " sessions:"));
    ops.forEach(o => list.appendChild(el("div", "prop-op", "• " + o.summary)));
    main.appendChild(list);
  }

  if (p.tradeoff) main.appendChild(el("div", "card-note", p.tradeoff));
  if (p.question) {
    main.appendChild(el("div", "prop-q",
      (p.blocked_pending_input ? "Needs an answer first — " : "") + p.question));
  }

  const acts = el("div", "prop-actions");
  if (stuck) {
    // Nothing to approve: there is no suggestion, only the honest answer that
    // the week can't absorb this. The two ways out are his to choose.
    const skip = el("button", "btn sm", "Skip it");
    skip.title = "Takes this session off the calendar for good.";
    skip.onclick = ev => { ev.stopPropagation(); setStatus(p.uid, "skipped"); };
    const leave = el("button", "btn sm", "Leave it");
    leave.title = "Keeps the clash on the calendar so you can decide later.";
    leave.onclick = ev => { ev.stopPropagation(); toast("Left as it is — it stays flagged until something changes."); };
    acts.appendChild(skip); acts.appendChild(leave);
  } else if (stale) {
    // No Approve at all: the backend refuses it, and offering a button that
    // can only fail is worse than not offering one.
    const no = el("button", "btn sm", "✕ Dismiss");
    no.title = "Takes this spent suggestion off the calendar.";
    no.onclick = ev => { ev.stopPropagation(); rejectProposal(p); };
    const again = el("button", "btn sm accent", "Ask again");
    again.title = "Re-plans this week against how it looks now.";
    again.onclick = ev => {
      ev.stopPropagation();
      requestProposals("manual", p.from_date || p.to_date);
    };
    acts.appendChild(no); acts.appendChild(again);
  } else {
    const isKeep = kind === "keep";
    const ok = el("button", "btn sm accent", isKeep ? "✓ Got it" : "✓ Approve");
    if (isKeep) ok.title = "Acknowledges Alfred's answer. Nothing on the calendar changes.";
    ok.disabled = !!p.blocked_pending_input;
    if (p.blocked_pending_input) ok.title = "Answer the question above first.";
    ok.onclick = ev => { ev.stopPropagation(); approveProposal(p); };
    const no = el("button", "btn sm", isKeep ? "✕ Dismiss" : "✕ Reject");
    no.onclick = ev => { ev.stopPropagation(); rejectProposal(p); };
    acts.appendChild(ok); acts.appendChild(no);
  }
  const why = el("button", "btn sm", "Why?");
  why.onclick = ev => { ev.stopPropagation(); S.selectedProposal = p.proposal_id; S.railOpen = true; render(); };
  acts.appendChild(why);
  main.appendChild(acts);

  body.appendChild(main);
  card.appendChild(body);
  card.onclick = () => { S.selectedProposal = p.proposal_id; render(); };
  return card;
}

/* -------------------------------------------------------------- month view */
function monthGrid() {
  const wrap = el("div");
  const head = el("div", "monthgrid");
  DAYNAMES.forEach(d => head.appendChild(el("div", "monthdow", d)));
  wrap.appendChild(head);

  const grid = el("div", "monthgrid");
  const r = monthGridRange();
  const month = parseISO(S.anchor).getMonth();
  const today = todayISO();
  let d = r.start;
  while (d <= r.end) {
    grid.appendChild(monthCell(d, parseISO(d).getMonth() === month, d === today));
    d = addDays(d, 1);
  }
  wrap.appendChild(grid);

  const note = el("p", "tile-sub");
  note.style.marginTop = "14px";
  note.textContent = "Month view is for the overview and for blocking out work days — "
    + "dragging is week view only, where the targets are big enough to hit reliably.";
  wrap.appendChild(note);
  return wrap;
}

function monthCell(date, inMonth, isToday) {
  const day = dayByDate(date);
  const unavailable = day && day.availability && day.availability.state === "unavailable";
  const cell = el("button", "mcell" + (inMonth ? "" : " out") + (isToday ? " today" : "")
    + (unavailable ? " unavailable" : ""));
  cell.type = "button";
  cell.title = unavailable ? "Marked unavailable — click to free it up"
    : "Click to mark " + longDay(date) + " " + dayNum(date) + " unavailable";

  const d = el("div", "mdate");
  d.appendChild(document.createTextNode(String(dayNum(date))));
  if (unavailable) d.appendChild(svg("g-lock", "lock"));
  cell.appendChild(d);

  ((day && day.workouts) || []).slice(0, 3).forEach(w => {
    const int = intensityOf(w);
    const c = el("div", "mchip");
    c.style.setProperty("--intensity", RAMP[int.step]);
    c.appendChild(el("i", "idot"));
    c.appendChild(svg(glyphOf(w), null));
    const dur = fmtDur(w.duration_s);
    c.appendChild(el("span", "mt", dur || w.title));
    c.title = w.title + " · " + int.word + (dur ? " · " + dur : "");
    cell.appendChild(c);
  });
  const extra = ((day && day.workouts) || []).length - 3;
  if (extra > 0) cell.appendChild(el("div", "loadlab", "+" + extra + " more"));
  // A spent suggestion earns no "suggested" dot: at month zoom the dot *is*
  // the whole message, and there is no room to qualify it.
  if (day && (day.proposals || []).some(p => p.status === "pending" && !p.stale)) {
    const c = el("div", "mchip");
    c.style.background = "var(--accent-wash)";
    c.style.color = "var(--accent)";
    c.appendChild(svg("g-spark", null));
    c.appendChild(el("span", "mt", "suggested"));
    cell.appendChild(c);
  }
  if (day && (day.unresolved || []).length) {
    const c = el("div", "mchip");
    c.style.background = "color-mix(in srgb,var(--status-warning) 18%,transparent)";
    c.style.color = "var(--ink)";
    c.appendChild(el("span", "mt", "⚠ can't place"));
    c.title = day.unresolved[0].rationale || "Alfred couldn't place this session.";
    cell.appendChild(c);
  }

  cell.onclick = () => toggleAvailability(date, cell);
  return cell;
}

/* -------------------------------------------------------------- table view */
function tableView() {
  const wrap = el("div", "tablewrap");
  const t = el("table");
  const thead = el("thead");
  const hr = el("tr");
  ["Date", "Workout", "Sport", "Duration", "TSS", "Intensity", "State", "Push"]
    .forEach(h => hr.appendChild(el("th", null, h)));
  thead.appendChild(hr);
  t.appendChild(thead);

  const tb = el("tbody");
  const rows = allWorkouts().slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  if (!rows.length) {
    const tr = el("tr");
    const td = el("td", "wrap", "Nothing planned in this range.");
    td.colSpan = 8;
    tr.appendChild(td); tb.appendChild(tr);
  }
  rows.forEach(w => {
    const int = intensityOf(w);
    const day = dayByDate(w.date);
    const un = day && day.availability && day.availability.state === "unavailable";
    const tr = el("tr");
    tr.appendChild(el("td", null, shortDay(w.date) + " " + dayNum(w.date) + (un ? " (unavailable)" : "")));
    tr.appendChild(el("td", "wrap", w.title));
    tr.appendChild(el("td", null, w.sport || "—"));
    tr.appendChild(el("td", null, fmtDur(w.duration_s) || "—"));
    const t2 = tssOf(w);
    tr.appendChild(el("td", null, t2 ? t2.text : "—"));
    tr.appendChild(el("td", null, int.word));
    tr.appendChild(el("td", null, w.is_moved ? ("moved from " + shortDay(w.plan_date)) : (w.status || "planned")));
    const p = pushInfo(w);
    tr.appendChild(el("td", "wrap", p ? p.text.replace(/^[^A-Za-z]+/, "") : "not queued"));
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  wrap.appendChild(t);
  return wrap;
}

/* ================================================================== rail */
function renderRail() {
  const rail = $("#rail");
  rail.textContent = "";
  const wide = window.matchMedia("(min-width:1281px)").matches;
  rail.hidden = !wide && !S.railOpen;
  if (rail.hidden) return;

  if (!wide) {
    const close = el("button", "btn sm", "✕ Close");
    close.onclick = () => { S.railOpen = false; render(); };
    rail.appendChild(close);
  }

  const days = (S.signal && S.signal.days) || [];
  const today = todayISO();

  /* --- readiness: one number -> a stat tile, not a chart --- */
  let readiness = null, readyDate = null;
  for (let i = days.length - 1; i >= 0; i--) {
    const r = days[i].garmin && days[i].garmin.readiness;
    if (r && typeof r.score === "number") { readiness = r; readyDate = days[i].date; break; }
  }
  const rt = el("section", "tile");
  rt.appendChild(el("div", "tile-h", "Training readiness"));
  if (readiness) {
    const row = el("div", "hero-row");
    row.appendChild(el("div", "hero", String(readiness.score)));
    const lvl = readinessWord(readiness.score, readiness.level);
    row.appendChild(el("div", "hero-word", lvl.word));
    rt.appendChild(row);
    const m = el("div", "readymeter " + lvl.cls);
    const fill = el("span");
    fill.style.width = Math.max(2, Math.min(100, readiness.score)) + "%";
    m.appendChild(fill);
    rt.appendChild(m);
    if (readiness.feedback) rt.appendChild(el("div", "tile-sub", readiness.feedback));
    if (readyDate && readyDate !== today) {
      rt.appendChild(el("div", "tile-sub", "From " + shortDay(readyDate) + " — no reading yet today."));
    }
  } else {
    rt.appendChild(el("div", "tile-sub",
      (S.status && S.status.sources && S.status.sources.garmin && !S.status.sources.garmin.configured)
        ? "Connect Garmin to see readiness here."
        : "No readiness reading in the last 7 days."));
  }
  rail.appendChild(rt);

  /* --- training status chip: text + glyph, not a gauge --- */
  const ts = (S.signal && S.signal.training_status) || (S.cal && S.cal.training_status);
  if (ts) {
    const c = el("section", "tile");
    c.appendChild(el("div", "tile-h", "Training status"));
    const chip = el("span", "statuschip");
    chip.appendChild(svg("g-info", null));
    chip.appendChild(document.createTextNode(titleCase(ts)));
    c.appendChild(chip);
    rail.appendChild(c);
  }

  /* --- 7-day load: single series, one color for every bar, no legend --- */
  const lt = el("section", "tile");
  const actualKnown = days.some(d => d.load && d.load.actual_tss);
  lt.appendChild(el("div", "tile-h", actualKnown ? "Training load · last 7 days" : "Planned load · last 7 days"));
  const chart = el("div", "loadchart");
  const vals = days.map(d => ({
    date: d.date,
    v: (actualKnown ? (d.load && d.load.actual_tss) : (d.load && d.load.planned_tss)) || 0
  }));
  const max = Math.max(1, ...vals.map(x => x.v));
  if (!vals.length) {
    lt.appendChild(el("div", "tile-sub", "No load data yet."));
  } else {
    // Selective direct labels -- the peak and today, never a number on every bar.
    const peak = vals.reduce((a, x) => (x.v > a.v ? x : a), vals[0]);
    vals.forEach(x => {
      const col = el("div", "loadcol");
      const label = x.v && (x.date === today || x.date === peak.date) ? String(Math.round(x.v)) : "";
      col.appendChild(el("div", "loadval", label));
      const track = el("div", "loadbar-track");
      const bar = el("div", "loadbar" + (x.date === today ? " is-today" : "") + (x.v ? "" : " zero"));
      bar.style.height = x.v ? Math.max(4, (x.v / max) * 100) + "%" : "3px";
      bar.title = shortDay(x.date) + " " + dayNum(x.date) + " · " + Math.round(x.v) + " TSS";
      track.appendChild(bar);
      col.appendChild(track);
      col.appendChild(el("div", "loadlab", shortDay(x.date)[0]));
      chart.appendChild(col);
    });
    lt.appendChild(chart);
  }
  rail.appendChild(lt);

  /* --- rationale panel for the selected proposal --- */
  const sel = allProposals().find(p => p.proposal_id === S.selectedProposal);
  if (sel) rail.appendChild(rationalePanel(sel));

  /* --- recent activities --- */
  const acts = [];
  days.slice().reverse().forEach(d => ((d.garmin && d.garmin.activities) || [])
    .forEach(a => acts.push(Object.assign({ date: d.date }, a))));
  const at = el("section", "tile");
  at.appendChild(el("div", "tile-h", "Recent activities"));
  if (!acts.length) {
    at.appendChild(el("div", "tile-sub", "Nothing recorded in the last 7 days."));
  } else {
    const list = el("div", "acts");
    acts.slice(0, 5).forEach(a => {
      const row = el("div", "act");
      row.appendChild(svg(SPORT_GLYPH[a.sport] || "g-dot", null));
      const c = el("div");
      c.appendChild(el("div", "act-n", a.name || "Activity"));
      const bits = [shortDay(a.date)];
      if (a.duration_s) bits.push(fmtDur(a.duration_s));
      if (a.distance_m) bits.push((a.distance_m / 1000).toFixed(1) + " km");
      if (a.tss) bits.push(Math.round(a.tss) + " load");
      c.appendChild(el("div", "act-m", bits.join(" · ")));
      row.appendChild(c);
      list.appendChild(row);
    });
    at.appendChild(list);
  }
  rail.appendChild(at);
}

function readinessWord(score, level) {
  if (score >= 75) return { word: level ? titleCase(level) : "Prime", cls: "" };
  if (score >= 50) return { word: level ? titleCase(level) : "Moderate", cls: "" };
  if (score >= 25) return { word: "Low", cls: "warn" };
  return { word: "Poor", cls: "bad" };
}
function titleCase(s) {
  return String(s).toLowerCase().replace(/(^|[\s_-])(\w)/g, (m, a, b) => (a === "_" || a === "-" ? " " : a) + b.toUpperCase());
}

function rationalePanel(p) {
  const box = el("section", "rationale");
  const heading = p.status === "unresolved" ? "Why nothing fits"
    : (p.kind === "keep" ? "Why this stays put" : "Why this move?");
  box.appendChild(el("div", "tile-h", heading));
  // The "why" panel is the one place that spells the reasoning out in full,
  // so it is also where a reason that has stopped being true must say so
  // first — before the sentence it invalidates.
  if (p.stale) {
    box.appendChild(el("div", "prop-stale",
      p.stale_reason || "The reason for this suggestion has gone."));
  }
  const reason = el("div", "tile-sub", p.rationale || "");
  if (p.stale) { reason.style.textDecoration = "line-through"; reason.style.opacity = ".6"; }
  box.appendChild(reason);

  (p.rationale_details || []).forEach(d => {
    const s = el("div", "tile-sub");
    s.textContent = "• " + d;
    box.appendChild(s);
  });

  const ops = (p.operations || []).filter(o => o.summary);
  if (ops.length) {
    box.appendChild(el("div", "tile-h", ops.length > 1
      ? "What approving changes (all of it, or none)" : "What approving changes"));
    ops.forEach(o => box.appendChild(el("div", "tile-sub", "• " + o.summary)));
  }

  const ev = el("div", "evidence");
  const push = (k, v) => {
    const r = el("div", "ev");
    r.appendChild(el("span", null, k));
    r.appendChild(el("span", null, String(v)));
    ev.appendChild(r);
  };
  if (p.from_date) push("From", shortDay(p.from_date) + " " + dayNum(p.from_date));
  if (p.to_date) push("To", shortDay(p.to_date) + " " + dayNum(p.to_date));
  if (typeof p.confidence === "number") push("Confidence", Math.round(p.confidence * 100) + "%");
  (p.signals_used || []).forEach(s => {
    const bits = String(s).split("=");
    push(bits[0], bits.slice(1).join("=") || "—");
  });
  if (ev.childNodes.length) box.appendChild(ev);

  if (p.tradeoff) {
    const t = el("div", "tile-sub");
    t.style.fontStyle = "italic";
    t.textContent = "Trade-off: " + p.tradeoff;
    box.appendChild(t);
  }
  if ((p.alternatives || []).length) {
    box.appendChild(el("div", "tile-h", "Days I ruled out"));
    const ul = el("ul", "altlist");
    p.alternatives.slice(0, 4).forEach(a => {
      ul.appendChild(el("li", null, shortDay(a.date) + " — " + a.reason));
    });
    box.appendChild(ul);
  }
  return box;
}

/* =========================================================== change bar */
function renderChangeBar() {
  const bar = $("#changebar");
  bar.textContent = "";
  const pending = allProposals().filter(p => p.status === "pending");
  const stuck = allUnresolved();
  if (!pending.length && !stuck.length) return;

  const jumpTo = p => {
    S.selectedProposal = p.proposal_id;
    S.railOpen = true;
    render();
    const c = document.querySelector('[data-proposal="' + cssEscape(p.proposal_id) + '"]');
    if (c) { c.scrollIntoView({ block: "center", behavior: "smooth" }); c.focus(); }
  };

  // Nothing to approve, but something he needs to know about: an unsolvable
  // week is visible on its own, not only alongside suggestions.
  if (!pending.length) {
    const b = el("div", "changebar");
    const label = el("span");
    label.appendChild(el("b", null, String(stuck.length)));
    label.appendChild(document.createTextNode(
      stuck.length === 1 ? " session I couldn't place"
        : " sessions I couldn't place"));
    b.appendChild(label);
    b.appendChild(el("span", "spacer"));
    const look = el("button", "btn sm", "Show me");
    look.onclick = () => jumpTo(stuck[0]);
    b.appendChild(look);
    bar.appendChild(b);
    return;
  }

  const b = el("div", "changebar");
  b.appendChild(el("span", "dot"));
  const label = el("span");
  label.appendChild(el("b", null, String(pending.length)));
  label.appendChild(document.createTextNode(
    pending.length === 1 ? " suggested change" : " suggested changes"));
  if (stuck.length) {
    label.appendChild(document.createTextNode(
      " · " + stuck.length + " I couldn't place"));
  }
  b.appendChild(label);
  b.appendChild(el("span", "spacer"));

  const review = el("button", "btn sm", "Review");
  review.onclick = () => jumpTo(pending[0]);
  const all = el("button", "btn sm accent", "Approve all");
  all.onclick = async () => {
    for (const p of pending) {
      if (p.blocked_pending_input) continue;
      await approveProposal(p, true);
    }
    await loadAll();
    toast("Approved " + pending.length + " changes. Nothing has gone to Garmin yet.");
  };
  const none = el("button", "btn sm", "Discard all");
  none.onclick = async () => {
    for (const p of pending) await rejectProposal(p, true);
    await loadAll();
    toast("Discarded all suggestions.");
  };
  b.appendChild(review); b.appendChild(all); b.appendChild(none);
  bar.appendChild(b);
}
function cssEscape(s) { return String(s).replace(/["\\]/g, "\\$&"); }

/* ============================================================== overlays */
function renderOverlays() {

}

/* ------------------------------------------------------- availability flow */
function toggleAvailability(date, anchor) {
  const day = dayByDate(date);
  const cur = (day && day.availability && day.availability.state) || "available";
  if (cur === "available") openAvailabilityPopover(date, anchor);
  else setAvailability(date, "available");
}

function openAvailabilityPopover(date, anchor) {
  closePopover();
  const back = el("div", "backdrop");
  back.onclick = closePopover;
  const pop = el("div", "popover");
  pop.setAttribute("role", "dialog");
  pop.setAttribute("aria-label", "Availability for " + longDay(date));

  pop.appendChild(el("h4", null, "Blocking out " + longDay(date) + " " + dayNum(date)));

  let reason = "work";
  pop.appendChild(el("div", "pop-lab", "Why?"));
  const row = el("div", "pop-row");
  [["work", "Work"], ["travel", "Travel"], ["family", "Family"], ["other", "Other"]].forEach(([k, lab]) => {
    const b = el("button", null, lab);
    b.type = "button";
    b.setAttribute("aria-pressed", String(k === reason));
    b.onclick = () => {
      reason = k;
      Array.from(row.children).forEach(c => c.setAttribute("aria-pressed", String(c === b)));
    };
    row.appendChild(b);
  });
  pop.appendChild(row);

  // The complaint is a recurring work pattern, so recurrence is offered at the
  // point of pain. The store is per-date, so this writes the next N weeks.
  const rec = el("label", "checkrow");
  const cb = el("input");
  cb.type = "checkbox";
  rec.appendChild(cb);
  rec.appendChild(document.createTextNode("Every " + longDay(date) + " for 8 weeks"));
  pop.appendChild(rec);

  const askAlfred = el("label", "checkrow");
  const cb2 = el("input");
  cb2.type = "checkbox";
  cb2.checked = true;
  askAlfred.appendChild(cb2);
  askAlfred.appendChild(document.createTextNode("Suggest where the session should go"));
  pop.appendChild(askAlfred);

  const acts = el("div", "pop-row");
  const go = el("button", "btn sm primary", "Mark unavailable");
  go.onclick = async () => {
    closePopover();
    const dates = [date];
    if (cb.checked) for (let i = 1; i < 8; i++) dates.push(addDays(date, 7 * i));
    await setAvailability(dates, "unavailable", reason, cb2.checked);
  };
  const limited = el("button", "btn sm", "Only ~1h");
  limited.onclick = async () => { closePopover(); await setAvailability([date], "limited", reason, cb2.checked, 60); };
  acts.appendChild(go); acts.appendChild(limited);
  pop.appendChild(acts);

  document.body.appendChild(back);
  document.body.appendChild(pop);
  positionPopover(pop, anchor);
  pop.querySelector("button").focus();
  S._popover = [back, pop];
}
function positionPopover(pop, anchor) {
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = r.left + window.scrollX;
  let top = r.bottom + window.scrollY + 6;
  if (left + w > window.innerWidth - 8) left = Math.max(8, window.innerWidth - w - 8);
  if (top + h > window.scrollY + window.innerHeight - 8) top = Math.max(8, r.top + window.scrollY - h - 6);
  pop.style.left = left + "px";
  pop.style.top = top + "px";
}
function closePopover() {
  if (S._popover) { S._popover.forEach(n => n.remove()); S._popover = null; }
}

async function setAvailability(dates, state, reason, askAlfred, maxMinutes) {
  const list = Array.isArray(dates) ? dates : [dates];
  try {
    for (const d of list) {
      if (state === "available") {
        await api("/api/days/" + d + "/availability", { method: "DELETE" });
      } else {
        await api("/api/days/" + d + "/availability", {
          method: "PUT",
          body: { state, note: reason ? titleCase(reason) : null, max_minutes: maxMinutes || null }
        });
      }
    }
    await loadAll();
    if (state === "available") {
      announce(longDay(list[0]) + " is available again.");
      toast(longDay(list[0]) + " is free again.");
    } else {
      announce(longDay(list[0]) + " marked unavailable.");
      // Marking a day off flags the sessions on it — it never moves anything by
      // itself. Alfred proposes; nothing changes until it is approved.
      // Ask about the week the blocked day is *in*: the engine plans one week
      // at a time, and in month view the visible range starts weeks earlier.
      if (askAlfred) await requestProposals("availability_changed", list[0]);
      else toast(list.length > 1 ? "Blocked out " + list.length + " " + longDay(list[0]) + "s." : longDay(list[0]) + " blocked out.");
    }
  } catch (e) {
    toast(e.message, "bad");
  }
}

/* ----------------------------------------------------------------- moving */
async function moveWorkout(uid, toDate, allowUnavailable) {
  const w = findWorkout(uid);
  if (!w) return;
  if (w.date === toDate) return;
  const from = w.date;
  try {
    await api("/api/workouts/" + encodeURIComponent(uid) + "/move", {
      method: "POST",
      body: { to_date: toDate, expected_rev: w.rev, allow_unavailable: !!allowUnavailable }
    });
    await loadAll();
    announce(w.title + " moved to " + longDay(toDate) + ".");
    toast("Moved " + w.title + " to " + shortDay(toDate) + ".", null, {
      label: "Undo",
      fn: async () => {
        try {
          await api("/api/workouts/" + encodeURIComponent(uid) + "/override", { method: "DELETE" });
          await loadAll();
          toast("Put " + w.title + " back on " + shortDay(from) + ".");
        } catch (e) { toast(e.message, "bad"); }
      }
    });
  } catch (e) {
    if (e.code === "day_unavailable") {
      const day = dayByDate(toDate);
      const why = day && day.availability && day.availability.note ? " (" + day.availability.note + ")" : "";
      toast("You marked " + longDay(toDate) + why + " unavailable — move it there anyway?", "bad",
        { label: "Move anyway", fn: () => moveWorkout(uid, toDate, true) });
      return;
    }
    if (e.code === "stale_rev") {
      await loadAll();
      toast("That workout changed while you were looking at it — try again.", "bad");
      return;
    }
    toast(e.message, "bad");
  }
}

async function setStatus(uid, status) {
  try {
    await api("/api/workouts/" + encodeURIComponent(uid), {
      method: "PATCH", body: { status: status }
    });
    await loadAll();
    if (status !== "skipped") { toast("Updated."); return; }
    /* Skipping is a local decision and takes nothing off the device. Telling
       him "it won't be sent to your Edge" about a session that is already
       sitting on it is the exact confusion this app exists to end — so where
       a copy is there, the toast says so and carries the way off. */
    const w = findWorkout(uid);
    const onGarmin = w && w.garmin && w.garmin.on_garmin;
    if (onGarmin) {
      toast("Skipped here — but it's still on your Garmin calendar.", null,
        removeBlockedReason() ? null
          : { label: "Remove from Garmin", fn: () => removeFromGarmin(w) });
      return;
    }
    toast("Skipped — it won't be sent to your Edge.");
  } catch (e) { toast(e.message, "bad"); }
}

/* ------------------------------------------------------ removal from Garmin */
/* The only thing in this app that takes a session OFF the athlete's calendar,
   and it never runs on its own: skipping, dropping or reverting a session
   changes the plan here and leaves the copy on the Edge until he asks for it
   to go. The template stays in his Garmin library either way — this removes a
   session from a calendar, it does not destroy anything.

   Same per-machine opt-in as a push, and the server checks it again on the
   write path, so a capability read that has gone stale here can only ever
   cost him a clear error, never an unwanted write. */
async function removeFromGarmin(w) {
  try {
    const res = await api("/api/workouts/" + encodeURIComponent(w.uid) + "/unpush",
      { method: "POST" });
    await loadAll();
    const r = res.result || {};
    toast(r.state === "skipped"
      ? "There was nothing of ours on your Garmin calendar."
      : "Taken off your Garmin calendar. Sync your Edge to clear it there too.");
  } catch (e) {
    if (e.code === "writes_disabled") {
      // Redraw with the real capability rather than leaving an affordance
      // that can only fail.
      try { S.status = await api("/api/status"); } catch (ignored) { /* keep the old one */ }
      render();
    }
    toast(e.message, "bad");
  }
}

/* Why removal can't be offered right now, or null when it can. Ordered
   most-specific first so the hint names the actual obstacle. */
function removeBlockedReason() {
  if (isDemo()) return "Demo mode never writes to Garmin, including removals.";
  if (!canPush()) return "Garmin isn't connected — add your login to .env.";
  if (!canWrite()) return writesBlockedReason()
    || "Writing to Garmin is switched off on this machine.";
  return null;
}

/* --------------------------------------------------------------- card menu */
function openCardMenu(w, anchor) {
  closePopover();
  const back = el("div", "backdrop");
  back.onclick = closePopover;
  const pop = el("div", "popover");
  pop.setAttribute("role", "menu");
  pop.appendChild(el("h4", null, w.title));

  const item = (label, fn, hint) => {
    const b = el("button", "btn sm", label);
    b.style.width = "100%";
    b.style.justifyContent = "flex-start";
    if (hint) b.title = hint;
    b.onclick = async () => { closePopover(); await fn(); };
    pop.appendChild(b);
    return b;
  };

  item(w.push_approved ? "✓ Approved for push — undo" : "Approve for push", async () => {
    try {
      await api("/api/workouts/" + encodeURIComponent(w.uid), {
        method: "PATCH", body: { push_approved: !w.push_approved }
      });
      await loadAll();
      toast(w.push_approved ? "Removed from the push queue." : "Queued for Garmin. Hit Push when ready.");
    } catch (e) { toast(e.message, "bad"); }
  }, "Approving a change and sending it to your Edge are two separate steps.");

  // Touch has no HTML5 drag, so the menu carries an explicit move.
  pop.appendChild(el("div", "pop-lab", "Move to"));
  const days = el("div", "pop-row");
  for (let i = 0; i < 7; i++) {
    const d = addDays(S.view === "week" ? S.anchor : mondayOf(w.date), i);
    const b = el("button", null, shortDay(d));
    b.type = "button";
    b.setAttribute("aria-pressed", String(d === w.date));
    b.style.flex = "0 0 auto";
    b.style.minWidth = "44px";
    b.onclick = async () => { closePopover(); await moveWorkout(w.uid, d); };
    days.appendChild(b);
  }
  pop.appendChild(days);

  // Routed through setStatus so both skip paths answer the same way — and so
  // skipping a session that is already on the Edge says so here too.
  item(w.status === "skipped" ? "Un-skip" : "Skip this session",
    () => setStatus(w.uid, w.status === "skipped" ? null : "skipped"));

  // Offered only where this app actually put a copy. A workout he built in
  // Garmin Connect himself is not ours to unschedule, and the server refuses
  // it — the menu must not pretend otherwise.
  if (w.garmin && w.garmin.on_garmin) {
    const blocked = removeBlockedReason();
    const rm = item("Remove from Garmin", () => removeFromGarmin(w),
      blocked || "Unschedules this app's copy. The workout itself stays in "
      + "your Garmin library, and nothing on your plan here changes.");
    if (blocked) { rm.disabled = true; rm.setAttribute("aria-disabled", "true"); }
  }

  if (w.override) {
    item("Revert to the coach's plan", async () => {
      try {
        await api("/api/workouts/" + encodeURIComponent(w.uid) + "/override", { method: "DELETE" });
        await loadAll();

      } catch (e) { toast(e.message, "bad"); }
    });
